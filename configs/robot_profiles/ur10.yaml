# Robot Profile: Universal Robots UR10
# Generated by: /analyze-embodiment ur10
# Source: IsaacLab config + UR datasheet
# Reference: isaaclab_assets/robots/universal_robots.py (UR10_CFG, UR10_LONG_SUCTION_CFG)

robot:
  name: ur10
  full_name: "Universal Robots UR10"
  arm_dofs: 6
  total_dofs: 6                        # no gripper DOFs (suction variant)

kinematics:
  max_reach: 1.30                      # m (UR10 datasheet)
  tabletop_reach: 1.00                 # m (practical horizontal reach at z~0)
  reach_source: datasheet              # urdf_chain | mcp_sampling | datasheet
  workspace_envelope:
    x: [0.20, 1.30]
    y: [-1.30, 1.30]
    z: [-0.50, 1.80]

joints:
  arm:
    names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    # UR10 joint limits (from UR datasheet): all joints +/- 2*pi
    limits:
      shoulder_pan_joint: [-6.2832, 6.2832]
      shoulder_lift_joint: [-6.2832, 6.2832]
      elbow_joint: [-3.1416, 3.1416]
      wrist_1_joint: [-6.2832, 6.2832]
      wrist_2_joint: [-6.2832, 6.2832]
      wrist_3_joint: [-6.2832, 6.2832]
    effort_limits:
      shoulder_pan_joint: 87.0
      shoulder_lift_joint: 87.0
      elbow_joint: 87.0
      wrist_1_joint: 87.0
      wrist_2_joint: 87.0
      wrist_3_joint: 87.0
    velocity_limits:
      shoulder_pan_joint: 2.175
      shoulder_lift_joint: 2.175
      elbow_joint: 2.175
      wrist_1_joint: 2.175
      wrist_2_joint: 2.175
      wrist_3_joint: 2.175
    stiffness: 800.0
    damping: 40.0
  finger:
    names: []                          # suction gripper — no finger joints
    mirrored: false
    type: none

gripper:
  type: suction                        # Long_Suction variant
  max_opening: null                    # N/A for suction
  open_position: null
  close_position: null
  max_force: null                      # suction force not modeled as joint
  variant: "Long_Suction"             # USD variant set name
  # Alternative variants: Short_Suction, none (bare arm)

physics:
  self_collision: false                # not set in UR10_CFG (defaults to false)
  disable_gravity: true                # Long_Suction variant disables gravity
  solver_position_iterations: 8        # default
  solver_velocity_iterations: 0
  max_depenetration_velocity: 5.0

spawn_ranges:
  reach_ratio: 1.33                    # 1.00 / 0.75 (vs Franka tabletop_reach)
  tabletop:
    object_x: [0.35, 0.65]            # clamped — no need to go further than 0.65
    object_y: [-0.25, 0.25]
    nominal_x: 0.5
    table_position: [0.5, 0.0, 0.0]
    table_scale: [1.0, 1.0, 1.0]
    furniture_scale: 1.0               # full-size furniture
  camera:
    position: [1.8, 1.5, 1.2]
    target: [0.3, 0.0, 0.3]

asset:
  usd_path: "{ISAAC_NUCLEUS_DIR}/Robots/UniversalRobots/ur10/ur10.usd"
  usd_path_instanceable: "{ISAACLAB_NUCLEUS_DIR}/Robots/UniversalRobots/UR10/ur10_instanceable.usd"
  prim_path: "/World/Robot"
  initial_position: [0, 0, 0]
  initial_rotation: [1, 0, 0, 0]      # wxyz
  variant_sets:
    Gripper: "Long_Suction"            # for manipulation tasks
  ee_frame:
    body: ee_link
  ready_pose:
    shoulder_pan_joint: 0.0
    shoulder_lift_joint: -1.5707
    elbow_joint: 1.5707
    wrist_1_joint: -1.5707
    wrist_2_joint: 1.5707
    wrist_3_joint: 0.0
  default_pose:
    shoulder_pan_joint: 0.0
    shoulder_lift_joint: -1.712
    elbow_joint: 1.712
    wrist_1_joint: 0.0
    wrist_2_joint: 0.0
    wrist_3_joint: 0.0
