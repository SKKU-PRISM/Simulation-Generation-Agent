# Robot Profile: OpenArm Unimanual
# Generated by: /analyze-embodiment openarm
# Source: IsaacLab config + datasheet estimation
# Reference: isaaclab_assets/robots/openarm.py (OPENARM_UNI_CFG)

robot:
  name: openarm
  full_name: "OpenArm Unimanual"
  arm_dofs: 7
  total_dofs: 9                        # 7 arm + 2 finger

kinematics:
  max_reach: 0.60                      # m (estimated from link lengths)
  tabletop_reach: 0.53                 # m (validated from existing task spawn ranges)
  reach_source: datasheet              # urdf_chain | mcp_sampling | datasheet
  workspace_envelope:
    x: [0.10, 0.60]
    y: [-0.60, 0.60]
    z: [-0.25, 0.85]
  # No URDF available — link_chain omitted
  # Motor specs:
  #   Joints 1-2: DM-J8009P-2EC (40 N*m, 2.175 rad/s)
  #   Joints 3-4: DM-J4340-2EC (27 N*m, 2.175 rad/s)
  #   Joints 5-7: DM-J4310-2EC (7 N*m, 2.61 rad/s)

joints:
  arm:
    names:
      - openarm_joint1
      - openarm_joint2
      - openarm_joint3
      - openarm_joint4
      - openarm_joint5
      - openarm_joint6
      - openarm_joint7
    # Joint limits not specified in IsaacLab config (soft_joint_pos_limit_factor=1.0)
    # Must be queried from USD at runtime or from datasheet
    effort_limits:
      openarm_joint1: 40.0
      openarm_joint2: 40.0
      openarm_joint3: 27.0
      openarm_joint4: 27.0
      openarm_joint5: 7.0
      openarm_joint6: 7.0
      openarm_joint7: 7.0
    velocity_limits:
      openarm_joint1: 2.175
      openarm_joint2: 2.175
      openarm_joint3: 2.175
      openarm_joint4: 2.175
      openarm_joint5: 2.610
      openarm_joint6: 2.610
      openarm_joint7: 2.610
    stiffness: 80.0
    damping: 4.0
  finger:
    names:
      - openarm_finger_joint1
      - openarm_finger_joint2
    mirrored: false                    # two independent finger joints
    type: prismatic
    limits:
      openarm_finger_joint1: [0.0, 0.044]
      openarm_finger_joint2: [0.0, 0.044]
  # Additional DOFs present in USD but not controlled:
  extra_dofs:
    - openarm_hand_joint               # fixed hand frame
    - openarm_ee_tcp_joint             # TCP frame

gripper:
  type: parallel_jaw
  max_opening: 0.088                   # m (2 x 0.044 finger travel)
  open_position: 0.044                 # per-finger joint value when open
  close_position: 0.0
  max_force: 333.33                    # N (effort_limit from actuator)
  stiffness: 2000.0
  damping: 100.0
  ee_finger_offset: 0.12              # m — estimated openarm_hand to finger tip

physics:
  self_collision: false
  disable_gravity: false
  solver_position_iterations: 8
  solver_velocity_iterations: 0
  max_depenetration_velocity: 5.0

spawn_ranges:
  reach_ratio: 0.71                    # 0.53 / 0.75 (vs Franka tabletop_reach)
  tabletop:
    object_x: [0.25, 0.45]            # validated against openarm/stack [0.25, 0.45]
    object_y: [-0.10, 0.10]
    nominal_x: 0.35
    table_position: [0.5, 0.0, 0.0]
    table_scale: [1.0, 1.0, 1.0]
    furniture_scale: 0.75              # scale furniture for shorter reach
  camera:
    position: [1.2, 1.0, 0.8]
    target: [0.3, 0.0, 0.2]

cameras:
  front:
    type: fixed
    position: [1.2, 1.0, 0.8]
    target: [0.3, 0.0, 0.2]
    resolution: [640, 480]
  wrist:
    type: body_mounted
    parent_body: openarm_hand
    offset_pos: [0.10, 0.0, -0.12]                          # 10cm fwd, 12cm down from hand
    offset_rot: [-0.70614, 0.03701, 0.03701, -0.70614]      # wxyz, ROS conv — looks downward
    convention: ros
    resolution: [320, 240]
  top:
    type: fixed
    position: [-0.05, 0.0, 1.3]        # behind robot, high up — robot at bottom of frame
    target: [0.30, 0.0, 0.2]            # workspace center
    resolution: [640, 480]

asset:
  usd_path: "{ISAAC_NUCLEUS_DIR}/Robots/OpenArm/openarm_unimanual/openarm_unimanual.usd"
  prim_path: "/World/Robot"
  initial_position: [0, 0, 0]
  initial_rotation: [1, 0, 0, 0]      # wxyz
  ee_frame:
    body: openarm_hand
    tcp_frame: openarm_ee_tcp
  ready_pose:
    openarm_joint1: 1.57
    openarm_joint2: 0.0
    openarm_joint3: -1.57
    openarm_joint4: 1.57
    openarm_joint5: 0.0
    openarm_joint6: 0.0
    openarm_joint7: 0.0
    openarm_finger_joint1: 0.0
    openarm_finger_joint2: 0.0
  default_pose:
    openarm_joint1: 1.57
    openarm_joint2: 0.0
    openarm_joint3: -1.57
    openarm_joint4: 1.57
    openarm_joint5: 0.0
    openarm_joint6: 0.0
    openarm_joint7: 0.0
    openarm_finger_joint1: 0.0
    openarm_finger_joint2: 0.0
