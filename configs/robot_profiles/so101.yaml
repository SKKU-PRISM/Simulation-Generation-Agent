# Robot Profile: SO-101 Follower Arm (LeRobot)
# Generated by: /import-urdf + manual analysis
# Source: URDF joint analysis (so101_new_calib.urdf)
# Reference: TheRobotStudio/SO-ARM100, Seeed Studio wiki

robot:
  name: so101
  full_name: "SO-101 Follower Arm (LeRobot)"
  arm_dofs: 5
  total_dofs: 6                              # 5 arm + 1 gripper

kinematics:
  max_reach: 0.30                            # m (estimated from URDF link lengths)
  tabletop_reach: 0.25                       # m (practical horizontal reach)
  reach_source: urdf_chain
  workspace_envelope:
    x: [-0.30, 0.30]
    y: [-0.30, 0.30]
    z: [0.0, 0.30]
  link_chain:
    - name: base_to_shoulder
      offset: [0, 0, 0.048]
      joint: shoulder_pan
      type: revolute
    - name: shoulder_to_upper_arm
      offset: [0, 0, 0.0485]
      joint: shoulder_lift
      type: revolute
    - name: upper_arm_to_lower_arm
      offset: [0.10425, 0, 0]
      joint: elbow_flex
      type: revolute
    - name: lower_arm_to_wrist
      offset: [0.095, 0, 0]
      joint: wrist_flex
      type: revolute
    - name: wrist_to_gripper
      offset: [0, 0, 0]
      joint: wrist_roll
      type: revolute
    - name: gripper_to_jaw
      offset: [0.068, 0, 0]
      joint: gripper
      type: revolute
    - name: gripper_to_frame
      offset: [0.068, 0, 0]
      joint: gripper_frame_joint
      type: fixed

joints:
  arm:
    names:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
    limits:
      shoulder_pan: [-1.920, 1.920]
      shoulder_lift: [-1.745, 1.745]
      elbow_flex: [-1.690, 1.690]
      wrist_flex: [-1.658, 1.658]
      wrist_roll: [-2.744, 2.841]
    effort_limits:
      shoulder_pan: 10.0
      shoulder_lift: 10.0
      elbow_flex: 10.0
      wrist_flex: 10.0
      wrist_roll: 10.0
    velocity_limits:
      shoulder_pan: 10.0
      shoulder_lift: 10.0
      elbow_flex: 10.0
      wrist_flex: 10.0
      wrist_roll: 10.0
    stiffness: 17.8                          # Seeed Studio recommended
    damping: 0.60
  finger:
    names:
      - gripper
    mirrored: false
    type: revolute                           # claw gripper (single revolute)
    limits:
      gripper: [-0.175, 1.745]

gripper:
  type: claw
  max_opening: 0.05                          # m (approximate jaw opening)
  open_position: 1.745                       # rad (max open)
  close_position: -0.175                     # rad (fully closed)
  max_force: 10.0                            # N (STS3215 servo)
  stiffness: 200.0
  damping: 10.0
  ee_finger_offset: 0.040                    # m — claw grasp offset from gripper_frame_link
  lateral_bias: 0.0                          # m — local TCP Y-bias for asymmetric single-jaw grasps
  close_duration: 1.5                        # s — give the claw time to settle around small cubes
  grasp_stiffness: 800.0                     # Nm/rad — runtime override for the single-jaw actuator

physics:
  self_collision: false
  disable_gravity: false
  solver_position_iterations: 8
  solver_velocity_iterations: 0
  max_depenetration_velocity: 5.0

spawn_ranges:
  reach_ratio: 0.33                          # 0.25 / 0.75 (vs Franka tabletop_reach)
  tabletop:
    object_x: [0.10, 0.20]
    object_y: [-0.08, 0.08]
    nominal_x: 0.15
    table_position: [0.15, 0.0, 0.0]
    table_scale: [0.5, 0.5, 0.5]
    furniture_scale: 0.4                     # small desktop workspace
  camera:
    position: [0.5, 0.4, 0.35]
    target: [0.15, 0.0, 0.1]

cameras:
  front:
    type: fixed
    position: [0.5, 0.4, 0.35]
    target: [0.15, 0.0, 0.1]
    resolution: [640, 480]
  wrist:
    type: body_mounted
    parent_body: gripper_frame_link
    offset_pos: [0.03, 0.0, -0.02]                          # near gripper — fingers visible at image bottom ~1/5
    offset_rot: [-0.70614, 0.03701, 0.03701, -0.70614]      # wxyz, ROS conv — looks downward
    convention: ros
    resolution: [640, 480]
  top:
    type: fixed
    position: [-0.05, 0.0, 0.5]        # behind robot, above — SO-101 has small workspace
    target: [0.12, 0.0, 0.08]           # workspace center
    resolution: [640, 480]

asset:
  usd_path: "assets/robots/so101/so101.usd"  # project-local USD (URDF converted)
  urdf_path: "{ADC_URDF_DIR}/so101_robot3.urdf"  # ADC submodule URDF (for Pinocchio IK)
  prim_path: "/World/Robot"
  initial_position: [0, 0, 0]
  initial_rotation: [1, 0, 0, 0]            # wxyz
  ee_frame:
    body: gripper_frame_link
    offset_position: [0.040, 0.0, 0.0]      # local TCP offset from gripper_frame_link to the grasp point
  ready_pose:
    shoulder_pan: 0.0
    shoulder_lift: -1.57
    elbow_flex: 1.57
    wrist_flex: 0.0
    wrist_roll: 0.0
    gripper: 1.0                             # open
  default_pose:
    shoulder_pan: 0.0
    shoulder_lift: 0.0
    elbow_flex: 0.0
    wrist_flex: 0.0
    wrist_roll: 0.0
    gripper: 1.0                             # open
