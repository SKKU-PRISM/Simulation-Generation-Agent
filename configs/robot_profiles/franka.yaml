# Robot Profile: Franka Emika Panda
# Generated by: /analyze-embodiment franka
# Source: URDF chain analysis + IsaacLab config
# Reference: lula_franka_gen.urdf, isaaclab_assets/robots/franka.py

robot:
  name: franka
  full_name: "Franka Emika Panda"
  arm_dofs: 7
  total_dofs: 9                        # 7 arm + 2 finger

kinematics:
  max_reach: 0.855                     # m (Franka datasheet)
  tabletop_reach: 0.75                 # m (practical horizontal reach at z~0)
  reach_source: urdf_chain             # urdf_chain | mcp_sampling | datasheet
  workspace_envelope:
    x: [0.15, 0.85]
    y: [-0.85, 0.85]
    z: [-0.36, 1.19]
  link_chain:
    - name: base_to_link1
      offset: [0, 0, 0.333]
      joint: panda_joint1
      type: revolute
    - name: link1_to_link2
      offset: [0, 0, 0]
      joint: panda_joint2
      type: revolute
      rpy: [-1.5708, 0, 0]
    - name: link2_to_link3
      offset: [0, -0.316, 0]
      joint: panda_joint3
      type: revolute
      rpy: [1.5708, 0, 0]
    - name: link3_to_link4
      offset: [0.0825, 0, 0]
      joint: panda_joint4
      type: revolute
      rpy: [1.5708, 0, 0]
    - name: link4_to_link5
      offset: [-0.0825, 0.384, 0]
      joint: panda_joint5
      type: revolute
      rpy: [-1.5708, 0, 0]
    - name: link5_to_link6
      offset: [0, 0, 0]
      joint: panda_joint6
      type: revolute
      rpy: [1.5708, 0, 0]
    - name: link6_to_link7
      offset: [0.088, 0, 0]
      joint: panda_joint7
      type: revolute
      rpy: [1.5708, 0, 0]
    - name: link7_to_link8
      offset: [0, 0, 0.107]
      joint: panda_joint8
      type: fixed
    - name: link8_to_hand
      offset: [0, 0, 0]
      joint: panda_hand_joint
      type: fixed
      rpy: [0, 0, -0.7854]
    - name: hand_to_ee
      offset: [0, 0, 0.107]
      joint: panda_end_effector
      type: fixed

joints:
  arm:
    names:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    limits:
      panda_joint1: [-2.8973, 2.8973]
      panda_joint2: [-1.7628, 1.7628]
      panda_joint3: [-2.8973, 2.8973]
      panda_joint4: [-3.0718, -0.0698]
      panda_joint5: [-2.8973, 2.8973]
      panda_joint6: [-0.0175, 3.7525]
      panda_joint7: [-2.8973, 2.8973]
    effort_limits:
      panda_joint1: 87.0
      panda_joint2: 87.0
      panda_joint3: 87.0
      panda_joint4: 87.0
      panda_joint5: 12.0
      panda_joint6: 12.0
      panda_joint7: 12.0
    velocity_limits:
      panda_joint1: 2.175
      panda_joint2: 2.175
      panda_joint3: 2.175
      panda_joint4: 2.175
      panda_joint5: 2.610
      panda_joint6: 2.610
      panda_joint7: 2.610
    stiffness:
      shoulder: 80.0                   # joints 1-4
      forearm: 80.0                    # joints 5-7
    damping:
      shoulder: 4.0
      forearm: 4.0
  finger:
    names:
      - panda_finger_joint1
      - panda_finger_joint2
    mirrored: true                     # joint2 mimics joint1
    type: prismatic
    limits:
      panda_finger_joint1: [0.0, 0.04]
      panda_finger_joint2: [0.0, 0.04]

gripper:
  type: parallel_jaw
  max_opening: 0.08                    # m (2 x 0.04 finger travel)
  open_position: 0.04                  # per-finger joint value when open
  close_position: 0.0
  max_force: 200.0                     # N (effort_limit from actuator)
  stiffness: 2000.0
  damping: 100.0
  ee_finger_offset: 0.1035            # m — panda_hand to finger tip (0.0584 joint + 0.045 pad)

physics:
  self_collision: true
  disable_gravity: false
  solver_position_iterations: 8
  solver_velocity_iterations: 0
  max_depenetration_velocity: 5.0

spawn_ranges:
  # Franka is the reference robot (reach_ratio = 1.0)
  reach_ratio: 1.0
  tabletop:
    object_x: [0.35, 0.65]            # validated against franka/stack [0.4, 0.6]
    object_y: [-0.15, 0.15]
    nominal_x: 0.5
    table_position: [0.5, 0.0, 0.0]
    table_scale: [1.0, 1.0, 1.0]
    furniture_scale: 1.0
  camera:
    position: [1.5, 1.2, 1.0]
    target: [0.25, 0.0, 0.3]

cameras:
  front:
    type: fixed
    position: [1.5, 1.2, 1.0]
    target: [0.25, 0.0, 0.3]
    resolution: [640, 480]
  wrist:
    type: body_mounted
    parent_body: panda_hand
    offset_pos: [0.065, 0.0, -0.10]                         # camera above palm, behind wrist → finger tips at image bottom ~1/5
    offset_rot: [-0.70614, 0.03701, 0.03701, -0.70614]      # wxyz, ROS conv — looks forward along finger direction
    convention: ros
    resolution: [320, 240]
  top:
    type: fixed
    position: [-0.1, 0.0, 1.8]         # behind robot, high up — gives near-top-down view
    target: [0.35, 0.0, 0.3]            # workspace center (table height) — robot at bottom of frame
    resolution: [640, 480]

asset:
  usd_path: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
  urdf_path: "{ISAACLAB_URDF_DIR}/lula_franka_gen.urdf"
  prim_path: "/World/Robot"
  initial_position: [0, 0, 0]
  initial_rotation: [1, 0, 0, 0]      # wxyz
  ee_frame:
    body: panda_hand
  ready_pose:
    panda_joint1: 0.0
    panda_joint2: -0.7854
    panda_joint3: 0.0
    panda_joint4: -2.3562
    panda_joint5: 0.0
    panda_joint6: 1.5708
    panda_joint7: 0.7854
    panda_finger_joint1: 0.04
    panda_finger_joint2: 0.04
  default_pose:
    panda_joint1: 0.0
    panda_joint2: -0.569
    panda_joint3: 0.0
    panda_joint4: -2.810
    panda_joint5: 0.0
    panda_joint6: 3.037
    panda_joint7: 0.741
    panda_finger_joint1: 0.04
    panda_finger_joint2: 0.04
