# Data Collection Pipeline Configuration
# Used by: scripts/run_data_collection.py, src/data_collection/pipeline.py

simulation:
  dt: 0.01                    # physics timestep (100Hz)
  decimation: 5               # control decimation -> 20Hz control
  control_hz: 20.0            # = 1 / (dt * decimation)

recording:
  fps: 20                     # recording FPS (matched to control_hz)
  resolution: [640, 480]      # camera resolution [width, height]

episodes:
  max: 50                     # maximum episodes per task
  max_steps: 600              # max steps per episode (30s at 20Hz)

dataset:
  repo_id: "local/sim_dataset"
  output_dir: "outputs/data_collection"

llm:
  model: "gpt-5-mini"         # Azure OpenAI model for CaP code generation

vlm:
  enabled: true               # use VLM for success judging
  backend: "auto"             # auto-detect: Azure -> Gemini -> Claude -> Ollama
  success_threshold: 0.8

skill:
  retry_max: 3                # legacy compatibility key; unused by the forward-only CaP path

# Goal verification (geometric, VLM 없이도 성공 판정 가능)
goal_verification:
  xy_threshold: 0.05          # m, max XY distance for stacking alignment
  height_diff: 0.05           # m, expected Z difference between stacked objects
  z_threshold: 0.01           # m, tolerance on height_diff check

# IK solver configuration
ik:
  num_random_samples: 30      # Pinocchio multi-start IK attempts
  orientation_tolerance: 0.15 # rad (~8.6°), allowed orientation error for 6-DOF IK

# Camera configuration
cameras:
  dataset_cameras: ["top", "wrist"]    # cameras included in dataset recording
  judge_cameras: ["wrist", "front"]    # cameras used for VLM judge (before/after images)
  # Camera specs defined per-robot in configs/robot_profiles/*.yaml

environment:
  headless: true
  num_envs: 1                 # single env for data collection
  timeout: 1800               # execution timeout in seconds (increased for shader compilation)
