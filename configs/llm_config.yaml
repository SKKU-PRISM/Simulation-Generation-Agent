# LLM Configuration for Task Specification Agent

# Default provider: 'azure' for Azure OpenAI or 'huggingface' for local models
default_provider: azure

# Azure OpenAI Configuration
azure_openai:
  endpoint: ${AZURE_OPENAI_ENDPOINT}  # Set via environment variable
  deployment_name: ${AZURE_OPENAI_DEPLOYMENT_NAME}  # Set via environment variable
  api_version: "2024-02-15-preview"
  model: "gpt-5-mini"
  temperature: 1.0  # gpt-5-mini only supports temperature=1.0
  max_tokens: 2000

# AWS Bedrock Configuration
bedrock:
  model: "us.anthropic.claude-opus-4-6-v1"
  region: "us-east-1"  # Override with AWS_DEFAULT_REGION env var
  temperature: 0.7
  max_tokens: 2000

# HuggingFace Local Models Configuration
huggingface:
  # Model options: EXAONE-3.5-32B-Instruct, meta-llama/Llama-3.1-70B-Instruct, etc.
  model_name: "LGAI-EXAONE/EXAONE-3.5-32B-Instruct"
  device: "cuda"  # 'cuda' for GPU, 'cpu' for CPU
  torch_dtype: "float16"  # 'float16' for GPU, 'float32' for CPU
  max_new_tokens: 2000
  temperature: 0.7
  top_p: 0.9
  do_sample: true
