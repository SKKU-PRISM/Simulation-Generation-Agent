# Task Document: UR10eCabinetBlocks
# Version: 1.1.0
# Description: UR10e picks 3 colored blocks from cabinet top and places on target zone

task:
  name: UR10eCabinetBlocks
  description: "UR10e picks 3 colored blocks from cabinet top and places them on a target zone on the floor"
  version: "1.1.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01667
  decimation: 1
  episode_length: 30.0
  render_interval: 1
  physx:
    solver_type: TGS
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, 0]

assets:
  # UR10e robot
  - name: robot
    type: articulation
    source: usd
    robot_type: ur10e
    asset_path: "{ISAAC_NUCLEUS_DIR}/Robots/UniversalRobots/ur10e/ur10e.usd"
    prim_path: "/World/Robot"
    position: [-0.2, 0, 0]
    rotation: [1, 0, 0, 0]
    variant_sets:
      Gripper: Robotiq_2f_85
    initial_joints:
      shoulder_pan_joint: 0.0
      shoulder_lift_joint: -1.712
      elbow_joint: 1.712
      wrist_1_joint: 0.0
      wrist_2_joint: 0.0
      wrist_3_joint: 0.0

  # Sektion Cabinet (full size, same as Franka)
  - name: cabinet
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Sektion_Cabinet/sektion_cabinet_instanceable.usd"
    prim_path: "/World/Cabinet"
    position: [0.8, 0.0, 0.4]
    rotation: [0, 0, 0, 1]
    joints:
      door_left_joint: 0.0
      door_right_joint: 0.0
      drawer_bottom_joint: 0.0
      drawer_top_joint: 0.0

  # Blue block on cabinet top (6cm cube, ~50g)
  - name: blue_block
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/BlueBlock"
    position: [0.8, -0.15, 0.832]
    rotation: [1, 0, 0, 0]
    scale: [0.06, 0.06, 0.06]
    color: [0.1, 0.2, 1.0]
    physics:
      rigid_body: true
      collision: true
      mass: 0.05
    randomize:
      position:
        type: absolute
        x: [0.60, 0.95]
        y: [-0.25, 0.25]
        z: 0.832
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.1

  # Red block on cabinet top (6cm cube, ~50g)
  - name: red_block
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/RedBlock"
    position: [0.8, 0.0, 0.832]
    rotation: [1, 0, 0, 0]
    scale: [0.06, 0.06, 0.06]
    color: [1.0, 0.15, 0.1]
    physics:
      rigid_body: true
      collision: true
      mass: 0.05
    randomize:
      position:
        type: absolute
        x: [0.60, 0.95]
        y: [-0.25, 0.25]
        z: 0.832
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.1

  # Green block on cabinet top (6cm cube, ~50g)
  - name: green_block
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/GreenBlock"
    position: [0.8, 0.15, 0.832]
    rotation: [1, 0, 0, 0]
    scale: [0.06, 0.06, 0.06]
    color: [0.1, 0.9, 0.2]
    physics:
      rigid_body: true
      collision: true
      mass: 0.05
    randomize:
      position:
        type: absolute
        x: [0.60, 0.95]
        y: [-0.25, 0.25]
        z: 0.832
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.1

  # Target zone on floor (gold flat pad between robot and cabinet)
  - name: target_zone
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/TargetZone"
    position: [0.3, 0.0, 0.003]
    scale: [0.15, 0.15, 0.003]              # 15cm x 15cm x 3mm flat pad
    color: [0.85, 0.65, 0.13]               # gold
    physics:
      rigid_body: false
      collision: false

goal:
  description: "Pick all 3 colored blocks from cabinet top and place them on the target zone"
  conditions:
    - subject: blue_block
      relation: at_position
      target: target_zone
      tolerance: 0.05
    - subject: red_block
      relation: at_position
      target: target_zone
      tolerance: 0.05
    - subject: green_block
      relation: at_position
      target: target_zone
      tolerance: 0.05

camera:
  prim_path: "/World/Camera"
  position: [0.8, 1.3, 1.6]
  target: [0.8, 0.0, 0.5]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Cabinet same as Franka (full-size at [0.8, 0, 0.4]), top z=0.802, blocks z=0.832"
  - "Blocks are rigid (graspable), must be picked from elevated cabinet top"
  - "UR10e at [-0.2, 0, 0] with Robotiq_2f_85 gripper — parallel-jaw grasp on each block"
  - "Target zone on floor at [0.3, 0, 0.003] between robot and cabinet"
  - "Episode 30s for 3 sequential pick-place cycles from elevated surface"
  - "Ground plane at z=0 (cabinet task convention)"
