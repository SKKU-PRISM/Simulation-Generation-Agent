# Task Document: UR10eLiftPegUpright
# Version: 1.0.0
# Template: v2.0.0
# Description: UR10e robot with Robotiq 2F-85 gripper lifts a two-tone peg to an upright position
# Reference: ManiSkill LiftPegUpright-v1 adapted for UR10e

task:
  name: UR10eLiftPegUpright
  description: "UR10e robot with Robotiq 2F-85 gripper picks up a two-tone peg (red+blue) lying flat on the table and lifts it into an upright (vertical) position"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01
  decimation: 2
  episode_length: 10.0
  render_interval: 2
  physx:
    solver_type: TGS
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625
    friction_offset_threshold: 0.01
    gpu_max_rigid_contact_count: 8388608

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]

assets:
  # UR10e robot (Robotiq 2F-85 gripper variant for peg reorientation)
  - name: robot
    type: articulation
    source: usd
    robot_type: ur10e
    asset_path: "{ISAAC_NUCLEUS_DIR}/Robots/UniversalRobots/ur10e/ur10e.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    variant_sets:
      Gripper: Robotiq_2f_85
    initial_joints:
      shoulder_pan_joint: 0.0
      shoulder_lift_joint: -1.5707
      elbow_joint: 1.5707
      wrist_1_joint: -1.5707
      wrist_2_joint: -1.5707
      wrist_3_joint: 0.0
    actuators:
      arm:
        joint_names: ["shoulder_pan_joint", "shoulder_lift_joint", "elbow_joint",
                      "wrist_1_joint", "wrist_2_joint", "wrist_3_joint"]
        effort_limit: 87.0
        stiffness: 800.0
        damping: 40.0
    ee_frame:
      body: wrist_3_link
      offset_position: [0.0, 0.0, 0.0]
    physics:
      self_collision: false
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # ===== Two-tone Peg (same as Franka version) =====

  - name: peg_red
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PegRed"
    position: [0.39, 0.0, 0.025]
    rotation: [1, 0, 0, 0]
    scale: [0.12, 0.05, 0.05]
    color: [0.69, 0.055, 0.055]
    physics:
      rigid_body: true
      collision: true
      mass: 0.1
      solver_position_iterations: 32
      solver_velocity_iterations: 1
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: relative
        x: [-0.05, 0.05]
        y: [-0.10, 0.10]
        z: 0.0

  - name: peg_blue
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PegBlue"
    position: [0.51, 0.0, 0.025]
    rotation: [1, 0, 0, 0]
    scale: [0.12, 0.05, 0.05]
    color: [0.047, 0.165, 0.627]
    physics:
      rigid_body: true
      collision: true
      mass: 0.1
      solver_position_iterations: 32
      solver_velocity_iterations: 1
      max_depenetration_velocity: 5.0

constraints:
  - name: PegFixedJoint
    type: fixed_joint
    parent: /World/PegRed
    child: /World/PegBlue
    local_pos0: [0.06, 0, 0]
    local_pos1: [-0.06, 0, 0]
    description: "Lock two peg halves together as a single rigid body"

goal:
  description: "Lift the two-tone peg from lying flat to an upright vertical position on the table"
  conditions:
    - subject: peg_red
      relation: upright
      target: table
      tolerance: 0.08
      description: "Peg standing upright on the table (within 0.08 rad of vertical)"

camera:
  prim_path: "/World/Camera"
  position: [0.15, 0.55, 0.45]
  target: [0.45, 0.0, 0.05]
  fov: 57
  resolution: [1280, 720]

notes:
  - "Source: ManiSkill LiftPegUpright-v1 adapted for UR10e"
  - "UR10e reach 1.30m — same positions as Franka version"
  - "Robotiq 2F-85 parallel-jaw grasp on the peg body before upright reorientation"
  - "Peg position randomized ±5cm X, ±10cm Y"
