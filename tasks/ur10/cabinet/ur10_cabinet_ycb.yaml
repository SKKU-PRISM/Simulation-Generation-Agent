# Task Document: UR10CabinetYCB
# Version: 1.0.0
# Description: UR10 robot with Sektion Cabinet and 3 YCB objects (mug, soup can, mustard bottle)

task:
  name: UR10CabinetYCB
  description: "Sektion Cabinet with YCB mug, tomato soup can, and mustard bottle on top (UR10)"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01667
  decimation: 1
  episode_length: 8.0
  render_interval: 1
  physx:
    solver_type: TGS
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, 0]

assets:
  # UR10 robot
  - name: robot
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Robots/UniversalRobots/ur10/ur10.usd"
    prim_path: "/World/Robot"
    position: [-0.2, 0, 0]
    rotation: [1, 0, 0, 0]
    variant_sets:
      Gripper: Long_Suction
    initial_joints:
      shoulder_pan_joint: 0.0
      shoulder_lift_joint: -1.712
      elbow_joint: 1.712
      wrist_1_joint: 0.0
      wrist_2_joint: 0.0
      wrist_3_joint: 0.0

  # Sektion Cabinet (full size, same as Franka)
  - name: cabinet
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Sektion_Cabinet/sektion_cabinet_instanceable.usd"
    prim_path: "/World/Cabinet"
    position: [0.8, 0.0, 0.4]
    rotation: [0, 0, 0, 1]
    joints:
      door_left_joint: 0.0
      door_right_joint: 0.0
      drawer_bottom_joint: 0.0
      drawer_top_joint: 0.0

  # YCB Mug on cabinet top (0.6x scale, -90X to stand up)
  - name: mug
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/YCB/Axis_Aligned/025_mug.usd"
    prim_path: "/World/Mug"
    position: [0.7, -0.15, 0.826]
    rotation: [0.7071, -0.7071, 0, 0]
    scale: [0.6, 0.6, 0.6]
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.60, 0.95]
        y: [-0.25, 0.25]
        z: 0.826
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # YCB Tomato Soup Can on cabinet top (0.6x scale, -90X to stand up)
  - name: tomato_soup_can
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/YCB/Axis_Aligned/005_tomato_soup_can.usd"
    prim_path: "/World/TomatoSoupCan"
    position: [0.8, 0.0, 0.833]
    rotation: [0.7071, -0.7071, 0, 0]
    scale: [0.6, 0.6, 0.6]
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.60, 0.95]
        y: [-0.25, 0.25]
        z: 0.833
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # YCB Mustard Bottle on cabinet top (0.6x scale, -90X to stand up)
  - name: mustard_bottle
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/YCB/Axis_Aligned/006_mustard_bottle.usd"
    prim_path: "/World/MustardBottle"
    position: [0.9, 0.15, 0.860]
    rotation: [0.7071, -0.7071, 0, 0]
    scale: [0.6, 0.6, 0.6]
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.60, 0.95]
        y: [-0.25, 0.25]
        z: 0.860
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

goal:
  description: "Environment with 3 graspable YCB objects on top of the Sektion Cabinet"

camera:
  prim_path: "/World/Camera"
  position: [0.8, 1.3, 1.6]
  target: [0.8, 0.0, 0.5]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Cabinet same as Franka (full-size at [0.8, 0, 0.4]), top z=0.802"
  - "UR10 at [-0.2, 0, 0] with Long_Suction gripper variant"
  - "All objects rotated -90 X (Y-up→Z-up) to stand upright"
  - "Randomization x=[0.60,0.95] constrained by UR10 reach (1.30m from base at x=-0.2)"
