# Task Document: UR10AssemblingKits
# Version: 1.0.0
# Template: v2.0.0
# Description: UR10 robot with suction gripper picks up a misplaced shape and inserts it into the kit tray
# Reference: ManiSkill AssemblingKits-v1 adapted for UR10

task:
  name: UR10AssemblingKits
  description: "UR10 robot with suction gripper picks up a misplaced colored shape piece and inserts it into the matching cutout slot on a kit tray board"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01
  decimation: 2
  episode_length: 10.0
  render_interval: 2
  physx:
    solver_type: TGS
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625
    friction_offset_threshold: 0.01
    gpu_max_rigid_contact_count: 8388608

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]

episode:
  kit_id: "kit_303"
  obj_to_place_candidates: [9, 11, 12, 15, 17]
  object_scale: [0.003, 0.003, 0.001]
  kit_objects:
    - object_id: 9
      pos: [-0.0495, 0.0844, 0.0]
      rot: 3.280
    - object_id: 15
      pos: [-0.1002, -0.1191, 0.0]
      rot: 4.214
    - object_id: 12
      pos: [0.0553, 0.1616, 0.0]
      rot: 5.114
    - object_id: 11
      pos: [0.0287, -0.0286, 0.0]
      rot: 2.860
    - object_id: 17
      pos: [0.0356, -0.1666, 0.0]
      rot: 0.735

assets:
  # UR10 robot with Long Suction gripper
  - name: robot
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Robots/UniversalRobots/ur10/ur10.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    variant_sets:
      Gripper: Long_Suction
    initial_joints:
      shoulder_pan_joint: 0.0
      shoulder_lift_joint: -1.5707
      elbow_joint: 1.5707
      wrist_1_joint: -1.5707
      wrist_2_joint: -1.5707
      wrist_3_joint: 0.0
    actuators:
      arm:
        joint_names: ["shoulder_pan_joint", "shoulder_lift_joint", "elbow_joint",
                      "wrist_1_joint", "wrist_2_joint", "wrist_3_joint"]
        effort_limit: 87.0
        stiffness: 800.0
        damping: 40.0
    ee_frame:
      body: ee_link
      offset_position: [0.22, 0, 0]
    physics:
      self_collision: false
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # Kit tray (same position as Franka version)
  - name: kit_tray
    type: static
    source: usd
    asset_path: "assets/assembling_kits/kit_303.usd"
    prim_path: "/World/KitTray"
    position: [0.45, 0.0, 0.01]
    rotation: [0.7071, 0, 0, 0.7071]
    scale: [1.0, 1.0, 1.0]
    color: [0.278, 0.209, 0.169]
    physics:
      collision: true
      rigid_body: false
      collision_mesh: triangle

  - name: shape_09
    type: static
    source: usd
    asset_path: "assets/assembling_kits/shape_09.usd"
    prim_path: "/World/Shape09"
    object_id: 9
    shape_name: "cloud"
    slot_position_local: [-0.0495, 0.0844, -0.01]
    slot_rotation_z: 3.280
    position: [0.3656, -0.0495, 0.0]
    rotation: [-0.7543, 0, 0, 0.6565]
    scale: [0.003, 0.003, 0.001]
    color: [0.306, 0.475, 0.655]
    physics:
      collision: false
      rigid_body: false

  - name: shape_11
    type: static
    source: usd
    asset_path: "assets/assembling_kits/shape_11.usd"
    prim_path: "/World/Shape11"
    object_id: 11
    shape_name: "circle"
    slot_position_local: [0.0287, -0.0286, -0.01]
    slot_rotation_z: 2.860
    position: [0.4786, 0.0287, 0.0]
    rotation: [-0.6009, 0, 0, 0.7993]
    scale: [0.003, 0.003, 0.001]
    color: [0.95, 0.95, 0.95]
    physics:
      collision: false
      rigid_body: false

  - name: shape_12
    type: rigid
    source: usd
    asset_path: "assets/assembling_kits/shape_12.usd"
    prim_path: "/World/Shape12"
    object_id: 12
    shape_name: "G_letter"
    slot_position_local: [0.0553, 0.1616, -0.01]
    slot_rotation_z: 5.114
    position: [0.45, -0.20, 0.0]
    rotation: [-0.9799, 0, 0, -0.1995]
    scale: [0.003, 0.003, 0.001]
    color: [0.690, 0.478, 0.631]
    physics:
      rigid_body: true
      collision: true
      mass: 0.02
    randomize:
      position:
        type: relative
        x: [-0.10, 0.10]
        y: [-0.10, 0.10]
        z: 0.0

  - name: shape_15
    type: static
    source: usd
    asset_path: "assets/assembling_kits/shape_15.usd"
    prim_path: "/World/Shape15"
    object_id: 15
    shape_name: "triangle"
    slot_position_local: [-0.1002, -0.1191, -0.01]
    slot_rotation_z: 4.214
    position: [0.5691, -0.1002, 0.0]
    rotation: [-0.9691, 0, 0, 0.2466]
    scale: [0.003, 0.003, 0.001]
    color: [0.929, 0.788, 0.282]
    physics:
      collision: false
      rigid_body: false

  - name: shape_17
    type: static
    source: usd
    asset_path: "assets/assembling_kits/shape_17.usd"
    prim_path: "/World/Shape17"
    object_id: 17
    shape_name: "pentagon"
    slot_position_local: [0.0356, -0.1666, -0.01]
    slot_rotation_z: 0.735
    position: [0.6166, 0.0356, 0.0]
    rotation: [0.4058, 0, 0, 0.9139]
    scale: [0.003, 0.003, 0.001]
    color: [0.349, 0.663, 0.310]
    physics:
      collision: false
      rigid_body: false

shape_to_place_config:
  spawn_z: 0.02
  physics:
    rigid_body: true
    collision: true
    mass: 0.02
    solver_position_iterations: 32
    solver_velocity_iterations: 1
    max_depenetration_velocity: 5.0
  randomize:
    position:
      type: relative
      x: [-0.10, 0.10]
      y: [-0.10, 0.10]
      z: 0.0
    orientation:
      yaw: [-3.14159, 3.14159]

goal:
  description: "Pick up the randomly misplaced shape and insert it into the matching cutout slot on the kit tray"
  conditions:
    - subject: shape_to_place
      relation: in_slot
      target: matching_cutout
      tolerance: 0.02
      description: "Misplaced shape inserted into its correct cutout (XY within 2cm, Z flush with tray)"

camera:
  prim_path: "/World/Camera"
  position: [0.30, 0.30, 0.50]
  target: [0.45, -0.01, 0.01]
  fov: 50
  resolution: [1280, 720]

notes:
  - "Source: ManiSkill AssemblingKits-v1 adapted for UR10"
  - "UR10 reach 1.30m — same positions as Franka version"
  - "Suction gripper ideal for flat shape pickup"
  - "Uses same mesh assets as Franka version (kit_303 + shapes)"
  - "Misplaced shape position randomized ±10cm in XY"
