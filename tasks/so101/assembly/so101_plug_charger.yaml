# Task Document: SO101PlugCharger
# Version: 1.0.0
# Template: v2.0.0
# Description: SO-101 robot picks up a small charger and inserts its prongs into a receptacle
# Reference: ManiSkill PlugCharger-v1 adapted for SO-101 (scaled down for small desktop)

task:
  name: SO101PlugCharger
  description: "SO-101 follower arm picks up a small charger (white base + two metallic prongs) and inserts the prongs into a wall-style receptacle with matching slots"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01
  decimation: 2
  episode_length: 10.0
  render_interval: 2
  physx:
    solver_type: TGS
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625
    friction_offset_threshold: 0.01
    gpu_max_rigid_contact_count: 8388608

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]

assets:
  # SO-101 Follower Arm
  - name: robot
    type: articulation
    source: usd
    asset_path: "assets/robots/so101/so101.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    initial_joints:
      shoulder_pan: 0.0
      shoulder_lift: -1.57
      elbow_flex: 1.57
      wrist_flex: 0.0
      wrist_roll: 0.0
      gripper: 1.0
    actuators:
      arm:
        joint_names: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll"]
        effort_limit: 10.0
        stiffness: 17.8
        damping: 0.60
      hand:
        joint_names: ["gripper"]
        effort_limit: 10.0
        stiffness: 200.0
        damping: 10.0
    ee_frame:
      body: gripper_frame_link
    physics:
      self_collision: false
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0

  # Small desktop table
  - name: table
    type: static
    source: primitive
    primitive: cube
    prim_path: "/World/Table"
    position: [0.15, 0.0, -0.015]
    scale: [0.30, 0.30, 0.03]
    color: [0.6, 0.5, 0.4]
    physics:
      rigid_body: false
      collision: true

  # ===== Charger (scaled to ~75% for SO-101 workspace) =====
  # Base: 3cm x 2.25cm x 1.8cm, prongs proportionally scaled

  - name: charger_base
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/ChargerBase"
    position: [0.16, -0.05, 0.009]
    rotation: [1, 0, 0, 0]
    scale: [0.03, 0.0225, 0.018]
    color: [1.0, 1.0, 1.0]
    physics:
      rigid_body: true
      collision: true
      mass: 0.03
      solver_position_iterations: 32
      solver_velocity_iterations: 1
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: relative
        x: [-0.02, 0.02]
        y: [-0.03, 0.03]
        z: 0.0

  - name: charger_prong_left
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/ChargerProngLeft"
    position: [0.181, -0.0553, 0.009]
    rotation: [1, 0, 0, 0]
    scale: [0.012, 0.0023, 0.0048]
    color: [0.45, 0.45, 0.48]
    physics:
      rigid_body: true
      collision: true
      mass: 0.003

  - name: charger_prong_right
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/ChargerProngRight"
    position: [0.181, -0.0448, 0.009]
    rotation: [1, 0, 0, 0]
    scale: [0.012, 0.0023, 0.0048]
    color: [0.45, 0.45, 0.48]
    physics:
      rigid_body: true
      collision: true
      mass: 0.003

  # ===== Receptacle (scaled to 50% — 5cm x 5cm face) =====

  - name: receptacle_back
    type: static
    source: primitive
    primitive: cube
    prim_path: "/World/ReceptBack"
    position: [0.238, 0.05, 0.035]
    rotation: [1, 0, 0, 0]
    scale: [0.010, 0.05, 0.05]
    color: [1.0, 1.0, 1.0]
    physics:
      rigid_body: false
      collision: true

  - name: receptacle_frame_bottom
    type: static
    source: primitive
    primitive: cube
    prim_path: "/World/ReceptFBot"
    position: [0.230, 0.05, 0.015]
    rotation: [1, 0, 0, 0]
    scale: [0.006, 0.05, 0.020]
    color: [1.0, 1.0, 1.0]
    physics:
      rigid_body: false
      collision: true

  - name: receptacle_frame_top
    type: static
    source: primitive
    primitive: cube
    prim_path: "/World/ReceptFTop"
    position: [0.230, 0.05, 0.055]
    rotation: [1, 0, 0, 0]
    scale: [0.006, 0.05, 0.020]
    color: [1.0, 1.0, 1.0]
    physics:
      rigid_body: false
      collision: true

  - name: receptacle_frame_mid
    type: static
    source: primitive
    primitive: cube
    prim_path: "/World/ReceptFMid"
    position: [0.230, 0.05, 0.035]
    rotation: [1, 0, 0, 0]
    scale: [0.006, 0.006, 0.014]
    color: [1.0, 1.0, 1.0]
    physics:
      rigid_body: false
      collision: true

  - name: receptacle_frame_left
    type: static
    source: primitive
    primitive: cube
    prim_path: "/World/ReceptFLeft"
    position: [0.230, 0.030, 0.035]
    rotation: [1, 0, 0, 0]
    scale: [0.006, 0.020, 0.014]
    color: [1.0, 1.0, 1.0]
    physics:
      rigid_body: false
      collision: true

  - name: receptacle_frame_right
    type: static
    source: primitive
    primitive: cube
    prim_path: "/World/ReceptFRight"
    position: [0.230, 0.070, 0.035]
    rotation: [1, 0, 0, 0]
    scale: [0.006, 0.020, 0.014]
    color: [1.0, 1.0, 1.0]
    physics:
      rigid_body: false
      collision: true

  - name: slot_fill_left
    type: static
    source: primitive
    primitive: cube
    prim_path: "/World/SlotFillLeft"
    position: [0.234, 0.0447, 0.035]
    rotation: [1, 0, 0, 0]
    scale: [0.003, 0.005, 0.014]
    color: [0.05, 0.05, 0.08]
    physics:
      rigid_body: false
      collision: false

  - name: slot_fill_right
    type: static
    source: primitive
    primitive: cube
    prim_path: "/World/SlotFillRight"
    position: [0.234, 0.0553, 0.035]
    rotation: [1, 0, 0, 0]
    scale: [0.003, 0.005, 0.014]
    color: [0.05, 0.05, 0.08]
    physics:
      rigid_body: false
      collision: false

constraints:
  - name: ChargerProngLeftJoint
    type: fixed_joint
    parent: /World/ChargerBase
    child: /World/ChargerProngLeft
    local_pos0: [0.015, -0.00525, 0]
    local_pos1: [-0.006, 0, 0]
    description: "Lock left prong to charger base"
  - name: ChargerProngRightJoint
    type: fixed_joint
    parent: /World/ChargerBase
    child: /World/ChargerProngRight
    local_pos0: [0.015, 0.00525, 0]
    local_pos1: [-0.006, 0, 0]
    description: "Lock right prong to charger base"

goal:
  description: "Pick up the charger and insert its prongs into the receptacle slots"
  conditions:
    - subject: charger_base
      relation: inserted_into
      target: receptacle_back
      tolerance: 0.005
      description: "Charger prongs fully inserted into receptacle (within 5mm)"

camera:
  prim_path: "/World/Camera"
  position: [0.40, 0.30, 0.25]
  target: [0.12, 0.0, 0.02]
  fov: 55
  resolution: [1280, 720]

notes:
  - "Source: ManiSkill PlugCharger-v1 adapted for SO-101"
  - "SO-101 reach ~0.27m — charger scaled 75%, receptacle scaled 50%"
  - "Charger base width 2.25cm < gripper ~5cm opening"
  - "Small desktop table 30cm x 30cm"
  - "Charger position randomized ±2cm in XY"
