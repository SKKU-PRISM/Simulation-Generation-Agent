# Task Document: SO101LiftPegUpright
# Version: 1.0.0
# Template: v2.0.0
# Description: SO-101 robot lifts a small two-tone peg to an upright position
# Reference: ManiSkill LiftPegUpright-v1 adapted for SO-101 (scaled down for small desktop)

task:
  name: SO101LiftPegUpright
  description: "SO-101 follower arm grasps a small two-tone peg (red+blue) lying flat on the desktop and lifts it into an upright (vertical) position"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01
  decimation: 2
  episode_length: 10.0
  render_interval: 2
  physx:
    solver_type: TGS
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625
    friction_offset_threshold: 0.01
    gpu_max_rigid_contact_count: 8388608

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]

assets:
  # SO-101 Follower Arm
  - name: robot
    type: articulation
    source: usd
    asset_path: "assets/robots/so101/so101.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    initial_joints:
      shoulder_pan: 0.0
      shoulder_lift: -1.57
      elbow_flex: 1.57
      wrist_flex: 0.0
      wrist_roll: 0.0
      gripper: 1.0
    actuators:
      arm:
        joint_names: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll"]
        effort_limit: 10.0
        stiffness: 17.8
        damping: 0.60
      hand:
        joint_names: ["gripper"]
        effort_limit: 10.0
        stiffness: 200.0
        damping: 10.0
    ee_frame:
      body: gripper_frame_link
    physics:
      self_collision: false
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0

  # Small desktop table
  - name: table
    type: static
    source: primitive
    primitive: cube
    prim_path: "/World/Table"
    position: [0.15, 0.0, -0.015]
    scale: [0.30, 0.30, 0.03]
    color: [0.6, 0.5, 0.4]
    physics:
      rigid_body: false
      collision: true

  # ===== Two-tone Peg: scaled to 50% =====
  # Each half: 6cm x 2.5cm x 2.5cm, total 12cm long

  - name: peg_red
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PegRed"
    position: [0.17, 0.0, 0.0125]
    rotation: [1, 0, 0, 0]
    scale: [0.06, 0.025, 0.025]
    color: [0.69, 0.055, 0.055]
    physics:
      rigid_body: true
      collision: true
      mass: 0.05
      solver_position_iterations: 32
      solver_velocity_iterations: 1
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: relative
        x: [-0.02, 0.02]
        y: [-0.04, 0.04]
        z: 0.0

  - name: peg_blue
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PegBlue"
    position: [0.23, 0.0, 0.0125]
    rotation: [1, 0, 0, 0]
    scale: [0.06, 0.025, 0.025]
    color: [0.047, 0.165, 0.627]
    physics:
      rigid_body: true
      collision: true
      mass: 0.05
      solver_position_iterations: 32
      solver_velocity_iterations: 1
      max_depenetration_velocity: 5.0

constraints:
  - name: PegFixedJoint
    type: fixed_joint
    parent: /World/PegRed
    child: /World/PegBlue
    local_pos0: [0.03, 0, 0]
    local_pos1: [-0.03, 0, 0]
    description: "Lock two peg halves together as a single rigid body"

goal:
  description: "Lift the two-tone peg from lying flat to an upright vertical position on the desktop"
  conditions:
    - subject: peg_red
      relation: upright
      target: table
      tolerance: 0.08
      description: "Peg standing upright on the table (within 0.08 rad of vertical)"

camera:
  prim_path: "/World/Camera"
  position: [0.40, 0.30, 0.25]
  target: [0.12, 0.0, 0.03]
  fov: 57
  resolution: [1280, 720]

notes:
  - "Source: ManiSkill LiftPegUpright-v1 adapted for SO-101"
  - "SO-101 reach ~0.27m — peg scaled 50% (12cm total, 2.5cm cross-section)"
  - "Peg cross-section 2.5cm < gripper ~5cm opening"
  - "Small desktop table 30cm x 30cm"
  - "Peg position randomized ±2cm X, ±3cm Y"
