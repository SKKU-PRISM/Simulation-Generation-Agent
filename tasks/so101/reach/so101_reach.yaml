# Task Document: SO101Reach
# Version: 1.0.0
# Template: v2.0.0
# Description: SO-101 robot tracks a commanded end-effector pose above the desktop
# Reference: OpenArmReach adapted for SO-101 (LeRobot) small desktop arm

task:
  name: SO101Reach
  description: "SO-101 follower arm tracks a commanded end-effector position and orientation target in its workspace"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]             # m/s^2
  timestep: 0.01                     # 100 Hz simulation
  decimation: 2                      # control at 50 Hz (every 2 sim steps)
  episode_length: 12.0               # seconds
  render_interval: 2

scene:
  lighting:
    type: dome
    intensity: 2500                   # slightly dimmer for reach task
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]          # IsaacLab convention

assets:
  # SO-101 Follower Arm (LeRobot)
  - name: robot
    type: articulation
    source: usd
    asset_path: "assets/robots/so101/so101.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]           # wxyz quaternion
    initial_joints:
      shoulder_pan: 0.0
      shoulder_lift: -1.57            # -pi/2
      elbow_flex: 1.57                # pi/2
      wrist_flex: 0.0
      wrist_roll: 0.0
      gripper: -0.175                 # closed (reach task, no grasping)
    actuators:
      arm:
        joint_names: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll"]
        effort_limit: 10.0            # N*m (STS3215 servo)
        stiffness: 17.8
        damping: 0.60
      hand:
        joint_names: ["gripper"]
        effort_limit: 10.0
        stiffness: 200.0
        damping: 10.0
    ee_frame:
      body: gripper_frame_link
    physics:
      self_collision: false
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0
    randomize:
      joint_position:
        distribution: scale           # scale factor from default (not offset)
        range: [0.5, 1.5]

  # Small desktop table (primitive box)
  - name: table
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/Table"
    position: [0.15, 0.0, -0.015]
    scale: [0.30, 0.30, 0.03]        # 30cm x 30cm x 3cm
    color: [0.6, 0.5, 0.4]
    physics:
      rigid_body: false
      collision: true

goal:
  description: "Track the commanded end-effector pose (position + orientation) in 6D workspace"
  conditions:
    - subject: end_effector
      relation: at_position
      target: command_pose
      tolerance: 0.03                 # 3cm position tracking (tighter for small workspace)
    - subject: end_effector
      relation: at_orientation
      target: command_pose
      tolerance: 0.1                  # orientation tracking threshold (rad)
  command_ranges:
    position:
      x: [0.08, 0.20]                # within SO-101 tabletop reach (0.25m)
      y: [-0.08, 0.08]               # matches robot profile spawn_ranges
      z: [0.05, 0.20]                # capped to avoid corner reach overflow
    orientation:
      roll: [-0.524, 0.524]           # +-pi/6
      pitch: [1.5708, 1.5708]         # pi/2 (fixed, EE pointing down)
      yaw: [-0.349, 0.349]            # +-pi/9
  resampling_interval: 4.0            # seconds between new command

camera:
  prim_path: "/World/Camera"
  position: [0.5, 0.4, 0.35]         # close desktop view
  target: [0.15, 0, 0.1]
  fov: 60
  resolution: [1280, 720]

notes:
  - "SO-101 follower arm (LeRobot/HuggingFace), 5 arm DOF + 1 gripper DOF"
  - "Local USD asset from URDF conversion (not Nucleus)"
  - "No manipulation object — pure end-effector pose tracking task"
  - "Gripper closed (-0.175 rad) — no grasping in reach task"
  - "Desktop workspace ~30cm x 30cm, command range within SO-101 reach"
  - "Command workspace: x=(0.08, 0.20), y=(-0.08, 0.08), z=(0.05, 0.20)"
  - "Joint reset uses scale factor (0.5, 1.5) from default"
  - "Control rate: 50Hz (decimation=2), episode: 12s"
  - "Lighting intensity: 2500 (dimmer for reach task)"
  - "Ground plane at z=-1.05 (IsaacLab convention)"
