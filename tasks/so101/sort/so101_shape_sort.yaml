# Task Document: SO101ShapeSort
# Version: 1.0.0
# Template: v2.0.0
# Description: SO-101 robot sorts primitive objects by shape (cubes vs spheres) into matching bins
# Reference: Adapted from franka/shape_sort for SO-101 (LeRobot) small desktop arm

task:
  name: SO101ShapeSort
  description: "SO-101 follower arm sorts objects by shape: place cubes on the purple bin, spheres on the rose bin"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01
  decimation: 5                      # control at 20 Hz
  episode_length: 30.0
  render_interval: 2
  physx:
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]

assets:
  # SO-101 Follower Arm (LeRobot)
  - name: robot
    type: articulation
    source: usd
    asset_path: "assets/robots/so101/so101.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    initial_joints:
      shoulder_pan: 0.0
      shoulder_lift: -1.57
      elbow_flex: 1.57
      wrist_flex: 0.0
      wrist_roll: 0.0
      gripper: 1.0
    actuators:
      arm:
        joint_names: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll"]
        effort_limit: 10.0
        stiffness: 17.8
        damping: 0.60
      hand:
        joint_names: ["gripper"]
        effort_limit: 10.0
        stiffness: 200.0
        damping: 10.0
    ee_frame:
      body: gripper_frame_link
    physics:
      self_collision: false
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0
    randomize:
      joint_position:
        distribution: gaussian
        mean: 0.0
        std: 0.02

  # Small desktop table
  - name: table
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/Table"
    position: [0.15, 0.0, -0.015]
    scale: [0.30, 0.30, 0.03]
    color: [0.6, 0.5, 0.4]
    physics:
      rigid_body: false
      collision: true

  # Small cube 1 (light blue)
  - name: small_cube_1
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/SmallCube1"
    position: [0.10, -0.03, 0.0075]
    scale: [0.015, 0.015, 0.015]
    color: [0.2, 0.6, 0.9]
    physics:
      rigid_body: true
      collision: true
      mass: 0.015
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.10, 0.18]
        y: [-0.06, 0.06]
        z: 0.0075
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.04

  # Small cube 2 (orange)
  - name: small_cube_2
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/SmallCube2"
    position: [0.14, 0.04, 0.0075]
    scale: [0.015, 0.015, 0.015]
    color: [0.9, 0.5, 0.2]
    physics:
      rigid_body: true
      collision: true
      mass: 0.015
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.10, 0.18]
        y: [-0.06, 0.06]
        z: 0.0075
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.04

  # Sphere 1 (pink)
  - name: sphere_1
    type: rigid
    source: primitive
    primitive: sphere
    prim_path: "/World/Sphere1"
    position: [0.12, 0.01, 0.0075]
    scale: [0.015, 0.015, 0.015]
    color: [0.9, 0.2, 0.5]
    physics:
      rigid_body: true
      collision: true
      mass: 0.012
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.10, 0.18]
        y: [-0.06, 0.06]
        z: 0.0075
      min_separation: 0.04

  # Sphere 2 (lime green)
  - name: sphere_2
    type: rigid
    source: primitive
    primitive: sphere
    prim_path: "/World/Sphere2"
    position: [0.16, -0.05, 0.0075]
    scale: [0.015, 0.015, 0.015]
    color: [0.5, 0.9, 0.3]
    physics:
      rigid_body: true
      collision: true
      mass: 0.012
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.10, 0.18]
        y: [-0.06, 0.06]
        z: 0.0075
      min_separation: 0.04

  # Cube bin (purple target zone)
  - name: cube_bin
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/CubeBin"
    position: [0.20, -0.05, 0.002]
    scale: [0.04, 0.04, 0.003]
    color: [0.4, 0.4, 0.7]
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.15, 0.25]
        y: [-0.10, 0.0]
        z: 0.002

  # Sphere bin (rose target zone)
  - name: sphere_bin
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/SphereBin"
    position: [0.20, 0.05, 0.002]
    scale: [0.04, 0.04, 0.003]
    color: [0.7, 0.4, 0.4]
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.15, 0.25]
        y: [0.0, 0.10]
        z: 0.002

goal:
  description: "Sort objects by shape: place cubes on the purple bin, spheres on the rose bin"
  conditions:
    - subject: small_cube_1
      relation: at_position
      target: cube_bin
      tolerance: 0.02
    - subject: small_cube_2
      relation: at_position
      target: cube_bin
      tolerance: 0.02
    - subject: sphere_1
      relation: at_position
      target: sphere_bin
      tolerance: 0.02
    - subject: sphere_2
      relation: at_position
      target: sphere_bin
      tolerance: 0.02

camera:
  prim_path: "/World/Camera"
  position: [0.5, 0.4, 0.35]
  target: [0.15, 0, 0.1]
  fov: 60
  resolution: [1280, 720]

notes:
  - "SO-101 follower arm (LeRobot/HuggingFace), 5 arm DOF + 1 gripper DOF"
  - "Primitive objects: 2 cubes (1.5cm) + 2 spheres (1.5cm diameter)"
  - "Cube z=0.0075m (half height), sphere z=0.0075m (radius)"
  - "Object spawn range: x=[0.10, 0.18], y=[-0.06, 0.06], min 4cm separation"
  - "Bins: 4x4cm colored pads at x=0.20"
  - "Desktop workspace ~30cm x 30cm, reach_ratio 0.33 vs Franka"
  - "Control rate: 20Hz (decimation=5), episode: 30s"
  - "Ground plane at z=-1.05 (IsaacLab convention)"
