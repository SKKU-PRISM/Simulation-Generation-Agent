# Task Document: OpenArmLiftPegUpright
# Version: 1.0.0
# Template: v2.0.0
# Description: OpenArm robot lifts a two-tone peg lying flat on the table to an upright position
# Reference: ManiSkill LiftPegUpright-v1 adapted for OpenArm

task:
  name: OpenArmLiftPegUpright
  description: "OpenArm unimanual robot grasps a two-tone peg (red+blue) lying flat on the table and lifts it into an upright (vertical) position"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01
  decimation: 2
  episode_length: 10.0
  render_interval: 2
  physx:
    solver_type: TGS
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625
    friction_offset_threshold: 0.01
    gpu_max_rigid_contact_count: 8388608

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]

assets:
  # OpenArm Unimanual robot
  - name: robot
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Robots/OpenArm/openarm_unimanual/openarm_unimanual.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    initial_joints:
      openarm_joint1: 1.57
      openarm_joint2: 0.0
      openarm_joint3: -1.57
      openarm_joint4: 1.57
      openarm_joint5: 0.0
      openarm_joint6: 0.0
      openarm_joint7: 0.0
      openarm_finger_joint1: 0.044
      openarm_finger_joint2: 0.044
    actuators:
      arm:
        joint_names: ["openarm_joint1", "openarm_joint2", "openarm_joint3", "openarm_joint4", "openarm_joint5", "openarm_joint6", "openarm_joint7"]
        stiffness: 80.0
        damping: 4.0
        effort_limit_per_joint:
          openarm_joint1: 40.0
          openarm_joint2: 40.0
          openarm_joint3: 27.0
          openarm_joint4: 27.0
          openarm_joint5: 7.0
          openarm_joint6: 7.0
          openarm_joint7: 7.0
      gripper:
        joint_names: ["openarm_finger_joint.*"]
        effort_limit: 333.33
        stiffness: 2000.0
        damping: 100.0
    ee_frame:
      body: openarm_hand
      tcp_frame: openarm_ee_tcp
    physics:
      self_collision: false
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # ===== Two-tone Peg: red + blue, lying flat on table =====
  # Same dimensions as Franka version, positioned closer

  - name: peg_red
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PegRed"
    position: [0.29, 0.0, 0.025]
    rotation: [1, 0, 0, 0]
    scale: [0.12, 0.05, 0.05]
    color: [0.69, 0.055, 0.055]
    physics:
      rigid_body: true
      collision: true
      mass: 0.1
      solver_position_iterations: 32
      solver_velocity_iterations: 1
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: relative
        x: [-0.04, 0.04]
        y: [-0.05, 0.05]
        z: 0.0

  - name: peg_blue
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PegBlue"
    position: [0.41, 0.0, 0.025]
    rotation: [1, 0, 0, 0]
    scale: [0.12, 0.05, 0.05]
    color: [0.047, 0.165, 0.627]
    physics:
      rigid_body: true
      collision: true
      mass: 0.1
      solver_position_iterations: 32
      solver_velocity_iterations: 1
      max_depenetration_velocity: 5.0

constraints:
  - name: PegFixedJoint
    type: fixed_joint
    parent: /World/PegRed
    child: /World/PegBlue
    local_pos0: [0.06, 0, 0]
    local_pos1: [-0.06, 0, 0]
    description: "Lock two peg halves together as a single rigid body"

goal:
  description: "Lift the two-tone peg from lying flat to an upright vertical position on the table"
  conditions:
    - subject: peg_red
      relation: upright
      target: table
      tolerance: 0.08
      description: "Peg standing upright on the table (within 0.08 rad of vertical)"

camera:
  prim_path: "/World/Camera"
  position: [0.05, 0.45, 0.40]
  target: [0.35, 0.0, 0.05]
  fov: 57
  resolution: [1280, 720]

notes:
  - "Source: ManiSkill LiftPegUpright-v1 adapted for OpenArm"
  - "OpenArm reach 0.60m — peg centered at x~0.35 (closer than Franka x~0.45)"
  - "Peg: two-tone (red 12cm + blue 12cm), cross-section 5cm < gripper 8.8cm"
  - "Peg position randomized ±4cm X, ±5cm Y"
