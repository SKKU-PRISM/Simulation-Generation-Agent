# Task Document: OpenArmLineArrange
# Version: 1.0.0
# Template: v2.0.0
# Description: OpenArm robot arranges 3 colored blocks in a specific left-to-right order
# Reference: Adapted from franka/line_arrange for OpenArm (~0.6m reach)

task:
  name: OpenArmLineArrange
  description: "OpenArm unimanual robot arranges colored blocks in a line at x=0.42: blue (y=-0.06), red (y=0.0), green (y=0.06)"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01
  decimation: 5                      # control at 20 Hz
  episode_length: 30.0
  render_interval: 2
  physx:
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]

assets:
  # OpenArm Unimanual robot
  - name: robot
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Robots/OpenArm/openarm_unimanual/openarm_unimanual.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    initial_joints:
      openarm_joint1: 1.57
      openarm_joint2: 0.0
      openarm_joint3: -1.57
      openarm_joint4: 1.57
      openarm_joint5: 0.0
      openarm_joint6: 0.0
      openarm_joint7: 0.0
      openarm_finger_joint1: 0.0
      openarm_finger_joint2: 0.0
    actuators:
      arm:
        joint_names: ["openarm_joint1", "openarm_joint2", "openarm_joint3", "openarm_joint4", "openarm_joint5", "openarm_joint6", "openarm_joint7"]
        stiffness: 80.0
        damping: 4.0
        effort_limit_per_joint:
          openarm_joint1: 40.0
          openarm_joint2: 40.0
          openarm_joint3: 27.0
          openarm_joint4: 27.0
          openarm_joint5: 7.0
          openarm_joint6: 7.0
          openarm_joint7: 7.0
      gripper:
        joint_names: ["openarm_finger_joint1", "openarm_finger_joint2"]
        effort_limit: 333.33
        stiffness: 2000.0
        damping: 100.0
        open_position: 0.044
        close_position: 0.0
    ee_frame:
      body: openarm_hand
      tcp_frame: openarm_ee_tcp
    physics:
      self_collision: false
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0
    randomize:
      joint_position:
        distribution: gaussian
        mean: 0.0
        std: 0.02

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # Blue block (target: left position)
  - name: blue_block
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/blue_block.usd"
    prim_path: "/World/BlueBlock"
    position: [0.32, 0.08, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "blue_block"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.25, 0.42]
        y: [-0.10, 0.10]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # Red block (target: center position)
  - name: red_block
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/red_block.usd"
    prim_path: "/World/RedBlock"
    position: [0.37, -0.04, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "red_block"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.25, 0.42]
        y: [-0.10, 0.10]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # Green block (target: right position)
  - name: green_block
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/green_block.usd"
    prim_path: "/World/GreenBlock"
    position: [0.42, 0.03, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "green_block"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.25, 0.42]
        y: [-0.10, 0.10]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # Position marker 1 - blue target (left)
  - name: pos_marker_1
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PosMarker1"
    position: [0.42, -0.06, 0.002]
    scale: [0.04, 0.04, 0.002]
    color: [0.0, 0.0, 0.6]
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.37, 0.47]
        y: [-0.11, -0.01]
        z: 0.002

  # Position marker 2 - red target (center)
  - name: pos_marker_2
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PosMarker2"
    position: [0.42, 0.0, 0.002]
    scale: [0.04, 0.04, 0.002]
    color: [0.6, 0.0, 0.0]
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.37, 0.47]
        y: [-0.05, 0.05]
        z: 0.002

  # Position marker 3 - green target (right)
  - name: pos_marker_3
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PosMarker3"
    position: [0.42, 0.06, 0.002]
    scale: [0.04, 0.04, 0.002]
    color: [0.0, 0.6, 0.0]
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.37, 0.47]
        y: [0.01, 0.11]
        z: 0.002

goal:
  description: "Arrange blocks in a line at x=0.42: blue (y=-0.06), red (y=0.0), green (y=0.06)"
  conditions:
    - subject: blue_block
      relation: at_position
      target: pos_marker_1
      tolerance: 0.025
    - subject: red_block
      relation: at_position
      target: pos_marker_2
      tolerance: 0.025
    - subject: green_block
      relation: at_position
      target: pos_marker_3
      tolerance: 0.025

camera:
  prim_path: "/World/Camera"
  position: [1.2, 1.0, 0.8]
  target: [0.35, 0, 0.2]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Adapted from franka/line_arrange for OpenArm (~0.6m reach)"
  - "Target line at x=0.42 with 6cm spacing (vs Franka x=0.55)"
  - "Block x range [0.25, 0.42] vs Franka [0.38, 0.55]"
  - "Tighter tolerance (2.5cm) to test precision placement"
  - "Position markers are dim-colored flat pads"
  - "Ground plane at z=-1.05 (IsaacLab convention)"
  - "Control rate: 20Hz (decimation=5), episode: 30s"
