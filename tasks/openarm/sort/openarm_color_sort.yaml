# Task Document: OpenArmColorSort
# Version: 1.0.0
# Template: v2.0.0
# Description: OpenArm robot sorts 3 colored blocks onto matching colored target zones
# Reference: Adapted from franka/color_sort for OpenArm (~0.6m reach)

task:
  name: OpenArmColorSort
  description: "OpenArm unimanual robot sorts colored blocks onto matching colored target zones: blue block -> blue zone, red block -> red zone, green block -> green zone"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]             # m/s^2
  timestep: 0.01                     # 100 Hz simulation
  decimation: 5                      # control at 20 Hz
  episode_length: 30.0               # seconds
  render_interval: 2
  physx:
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]

assets:
  # OpenArm Unimanual robot
  - name: robot
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Robots/OpenArm/openarm_unimanual/openarm_unimanual.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    initial_joints:
      openarm_joint1: 1.57
      openarm_joint2: 0.0
      openarm_joint3: -1.57
      openarm_joint4: 1.57
      openarm_joint5: 0.0
      openarm_joint6: 0.0
      openarm_joint7: 0.0
      openarm_finger_joint1: 0.0
      openarm_finger_joint2: 0.0
    actuators:
      arm:
        joint_names: ["openarm_joint1", "openarm_joint2", "openarm_joint3", "openarm_joint4", "openarm_joint5", "openarm_joint6", "openarm_joint7"]
        stiffness: 80.0
        damping: 4.0
        effort_limit_per_joint:
          openarm_joint1: 40.0
          openarm_joint2: 40.0
          openarm_joint3: 27.0
          openarm_joint4: 27.0
          openarm_joint5: 7.0
          openarm_joint6: 7.0
          openarm_joint7: 7.0
      gripper:
        joint_names: ["openarm_finger_joint1", "openarm_finger_joint2"]
        effort_limit: 333.33
        stiffness: 2000.0
        damping: 100.0
        open_position: 0.044
        close_position: 0.0
    ee_frame:
      body: openarm_hand
      tcp_frame: openarm_ee_tcp
    physics:
      self_collision: false
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0
    randomize:
      joint_position:
        distribution: gaussian
        mean: 0.0
        std: 0.02

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # Blue block
  - name: blue_block
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/blue_block.usd"
    prim_path: "/World/BlueBlock"
    position: [0.32, 0.0, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "blue_block"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.25, 0.42]
        y: [-0.10, 0.10]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # Red block
  - name: red_block
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/red_block.usd"
    prim_path: "/World/RedBlock"
    position: [0.37, -0.05, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "red_block"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.25, 0.42]
        y: [-0.10, 0.10]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # Green block
  - name: green_block
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/green_block.usd"
    prim_path: "/World/GreenBlock"
    position: [0.42, 0.05, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "green_block"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.25, 0.42]
        y: [-0.10, 0.10]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # Blue target zone
  - name: blue_zone
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/BlueZone"
    position: [0.47, -0.12, 0.002]
    scale: [0.06, 0.06, 0.003]
    color: [0.0, 0.0, 0.8]
    physics:
      rigid_body: false
      collision: false

  # Red target zone
  - name: red_zone
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/RedZone"
    position: [0.47, 0.0, 0.002]
    scale: [0.06, 0.06, 0.003]
    color: [0.8, 0.0, 0.0]
    physics:
      rigid_body: false
      collision: false

  # Green target zone
  - name: green_zone
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/GreenZone"
    position: [0.47, 0.12, 0.002]
    scale: [0.06, 0.06, 0.003]
    color: [0.0, 0.8, 0.0]
    physics:
      rigid_body: false
      collision: false

goal:
  description: "Sort each colored block onto its matching colored zone: blue block -> blue zone, red block -> red zone, green block -> green zone"
  conditions:
    - subject: blue_block
      relation: at_position
      target: blue_zone
      tolerance: 0.03
    - subject: red_block
      relation: at_position
      target: red_zone
      tolerance: 0.03
    - subject: green_block
      relation: at_position
      target: green_zone
      tolerance: 0.03

camera:
  prim_path: "/World/Camera"
  position: [1.2, 1.0, 0.8]
  target: [0.35, 0, 0.2]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Adapted from franka/color_sort for OpenArm (~0.6m reach)"
  - "Block x range [0.25, 0.42] vs Franka [0.38, 0.55]"
  - "Target zones at x=0.47 vs Franka x=0.60"
  - "Block z=0.0203m is table surface + half block height"
  - "Target zones are flat visual markers (no physics, no collision)"
  - "Ground plane at z=-1.05 (IsaacLab convention)"
  - "Control rate: 20Hz (decimation=5), episode: 30s"
