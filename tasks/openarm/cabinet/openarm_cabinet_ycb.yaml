# Task Document: OpenArmCabinetYCB
# Version: 1.0.0
# Description: OpenArm robot with scaled Sektion Cabinet and 3 YCB objects

task:
  name: OpenArmCabinetYCB
  description: "OpenArm picks 3 YCB objects from scaled cabinet top and places them on a target zone"
  version: "1.1.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01667
  decimation: 1
  episode_length: 30.0
  render_interval: 1
  physx:
    solver_type: TGS
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, 0]

assets:
  # OpenArm Unimanual robot
  - name: robot
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Robots/OpenArm/openarm_unimanual/openarm_unimanual.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    initial_joints:
      openarm_joint1: 1.57
      openarm_joint2: 0.0
      openarm_joint3: -1.57
      openarm_joint4: 1.57
      openarm_joint5: 0.0
      openarm_joint6: 0.0
      openarm_joint7: 0.0
      openarm_finger_joint1: 0.0
      openarm_finger_joint2: 0.0

  # Sektion Cabinet (0.75x scale for OpenArm)
  - name: cabinet
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Sektion_Cabinet/sektion_cabinet_instanceable.usd"
    prim_path: "/World/Cabinet"
    position: [0.7, 0.0, 0.3]
    rotation: [0, 0, 0, 1]
    scale: [0.75, 0.75, 0.75]
    joints:
      door_left_joint: 0.0
      door_right_joint: 0.0
      drawer_bottom_joint: 0.0
      drawer_top_joint: 0.0

  # YCB Mug on cabinet top (0.6x scale, -90X to stand up)
  - name: mug
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/YCB/Axis_Aligned/025_mug.usd"
    prim_path: "/World/Mug"
    position: [0.6, -0.1, 0.625]
    rotation: [0.7071, -0.7071, 0, 0]
    scale: [0.6, 0.6, 0.6]
    physics:
      rigid_body: true
      collision: true
    randomize:
      position:
        type: absolute
        x: [0.48, 0.62]
        y: [-0.15, 0.15]
        z: 0.625
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.06

  # YCB Tomato Soup Can on cabinet top (0.6x scale, -90X to stand up)
  - name: tomato_soup_can
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/YCB/Axis_Aligned/005_tomato_soup_can.usd"
    prim_path: "/World/TomatoSoupCan"
    position: [0.7, 0.0, 0.632]
    rotation: [0.7071, -0.7071, 0, 0]
    scale: [0.6, 0.6, 0.6]
    physics:
      rigid_body: true
      collision: true
    randomize:
      position:
        type: absolute
        x: [0.48, 0.62]
        y: [-0.15, 0.15]
        z: 0.632
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.06

  # YCB Mustard Bottle on cabinet top (0.6x scale, -90X to stand up)
  - name: mustard_bottle
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/YCB/Axis_Aligned/006_mustard_bottle.usd"
    prim_path: "/World/MustardBottle"
    position: [0.8, 0.1, 0.659]
    rotation: [0.7071, -0.7071, 0, 0]
    scale: [0.6, 0.6, 0.6]
    physics:
      rigid_body: true
      collision: true
    randomize:
      position:
        type: absolute
        x: [0.48, 0.62]
        y: [-0.15, 0.15]
        z: 0.659
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.06

  # Target zone on floor (gold flat pad between robot and cabinet)
  - name: target_zone
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/TargetZone"
    position: [0.35, 0.0, 0.003]
    scale: [0.12, 0.12, 0.003]              # 12cm x 12cm x 3mm flat pad
    color: [0.85, 0.65, 0.13]               # gold
    physics:
      rigid_body: false
      collision: false

goal:
  description: "Pick all 3 YCB objects from cabinet top and place them on the target zone"
  conditions:
    - subject: mug
      relation: at_position
      target: target_zone
      tolerance: 0.05
    - subject: tomato_soup_can
      relation: at_position
      target: target_zone
      tolerance: 0.05
    - subject: mustard_bottle
      relation: at_position
      target: target_zone
      tolerance: 0.05

camera:
  prim_path: "/World/Camera"
  position: [0.7, 1.0, 1.2]
  target: [0.7, 0.0, 0.4]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Cabinet at [0.7, 0, 0.3] 0.75x scale, top z=0.601"
  - "Objects at z=top+half_height, soup can/mustard rotated -90 X (Y-up→Z-up)"
  - "Objects are rigid (graspable), must be picked from elevated cabinet top"
  - "Target zone on floor at [0.35, 0, 0.003] between robot and cabinet"
  - "Episode 30s for 3 sequential pick-place cycles from elevated surface"
  - "Randomization x=[0.48,0.62] constrained by OpenArm workspace x_max=0.60"
