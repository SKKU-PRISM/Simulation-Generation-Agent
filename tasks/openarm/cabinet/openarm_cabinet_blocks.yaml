# Task Document: OpenArmCabinetBlocks
# Version: 1.1.0
# Description: OpenArm picks 3 colored blocks from scaled cabinet top and places on target zone

task:
  name: OpenArmCabinetBlocks
  description: "OpenArm picks 3 colored blocks from cabinet top and places them on a target zone on the floor"
  version: "1.1.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01667
  decimation: 1
  episode_length: 30.0
  render_interval: 1
  physx:
    solver_type: TGS
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, 0]

assets:
  # OpenArm Unimanual robot
  - name: robot
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Robots/OpenArm/openarm_unimanual/openarm_unimanual.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    initial_joints:
      openarm_joint1: 1.57
      openarm_joint2: 0.0
      openarm_joint3: -1.57
      openarm_joint4: 1.57
      openarm_joint5: 0.0
      openarm_joint6: 0.0
      openarm_joint7: 0.0
      openarm_finger_joint1: 0.0
      openarm_finger_joint2: 0.0

  # Sektion Cabinet (0.75x scale for OpenArm)
  - name: cabinet
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Sektion_Cabinet/sektion_cabinet_instanceable.usd"
    prim_path: "/World/Cabinet"
    position: [0.7, 0.0, 0.3]
    rotation: [0, 0, 0, 1]
    scale: [0.75, 0.75, 0.75]
    joints:
      door_left_joint: 0.0
      door_right_joint: 0.0
      drawer_bottom_joint: 0.0
      drawer_top_joint: 0.0

  # Blue block on cabinet top (5cm cube, ~50g)
  - name: blue_block
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/BlueBlock"
    position: [0.7, -0.12, 0.626]
    rotation: [1, 0, 0, 0]
    scale: [0.05, 0.05, 0.05]
    color: [0.1, 0.2, 1.0]
    physics:
      rigid_body: true
      collision: true
      mass: 0.05
    randomize:
      position:
        type: absolute
        x: [0.48, 0.62]
        y: [-0.15, 0.15]
        z: 0.626
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.06

  # Red block on cabinet top (5cm cube, ~50g)
  - name: red_block
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/RedBlock"
    position: [0.7, 0.0, 0.626]
    rotation: [1, 0, 0, 0]
    scale: [0.05, 0.05, 0.05]
    color: [1.0, 0.15, 0.1]
    physics:
      rigid_body: true
      collision: true
      mass: 0.05
    randomize:
      position:
        type: absolute
        x: [0.48, 0.62]
        y: [-0.15, 0.15]
        z: 0.626
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.06

  # Green block on cabinet top (5cm cube, ~50g)
  - name: green_block
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/GreenBlock"
    position: [0.7, 0.12, 0.626]
    rotation: [1, 0, 0, 0]
    scale: [0.05, 0.05, 0.05]
    color: [0.1, 0.9, 0.2]
    physics:
      rigid_body: true
      collision: true
      mass: 0.05
    randomize:
      position:
        type: absolute
        x: [0.48, 0.62]
        y: [-0.15, 0.15]
        z: 0.626
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.06

  # Target zone on floor (gold flat pad between robot and cabinet)
  - name: target_zone
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/TargetZone"
    position: [0.35, 0.0, 0.003]
    scale: [0.12, 0.12, 0.003]              # 12cm x 12cm x 3mm flat pad
    color: [0.85, 0.65, 0.13]               # gold
    physics:
      rigid_body: false
      collision: false

goal:
  description: "Pick all 3 colored blocks from cabinet top and place them on the target zone"
  conditions:
    - subject: blue_block
      relation: at_position
      target: target_zone
      tolerance: 0.05
    - subject: red_block
      relation: at_position
      target: target_zone
      tolerance: 0.05
    - subject: green_block
      relation: at_position
      target: target_zone
      tolerance: 0.05

camera:
  prim_path: "/World/Camera"
  position: [0.7, 1.0, 1.2]
  target: [0.7, 0.0, 0.4]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Cabinet at [0.7, 0, 0.3] 0.75x scale, rotation [0,0,0,1] (180 deg Z)"
  - "Cabinet top surface z ~ 0.60, blocks at z=0.626 (surface + half 5cm cube)"
  - "Blocks are rigid (graspable), must be picked from elevated cabinet top"
  - "Target zone on floor at [0.35, 0, 0.003] between robot and cabinet"
  - "Episode 30s for 3 sequential pick-place cycles from elevated surface"
  - "Ground plane at z=0 (cabinet task convention)"
