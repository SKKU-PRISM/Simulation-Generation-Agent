# Task Document: OpenArmPickPlaceDrawer
# Version: 1.0.0
# Template: v2.0.0
# Description: OpenArm robot picks a DexCube from the table and places it on top of a small drawer
# Reference: Adapted from franka/pick_place_drawer for OpenArm (~0.6m reach, ratio 0.71)

task:
  name: OpenArmPickPlaceDrawer
  description: "OpenArm unimanual robot picks up a DexCube from the table and places it on top of a small drawer box positioned on the table"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]             # m/s^2
  timestep: 0.01                     # 100 Hz simulation
  decimation: 5                      # control at 20 Hz (every 5 sim steps)
  episode_length: 15.0               # seconds (longer for slower OpenArm)
  render_interval: 2
  physx:
    bounce_threshold: 0.01           # m/s
    friction_correlation_distance: 0.00625  # m
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]          # IsaacLab convention

assets:
  # OpenArm Unimanual robot
  - name: robot
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Robots/OpenArm/openarm_unimanual/openarm_unimanual.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]           # wxyz quaternion
    initial_joints:
      openarm_joint1: 1.57               # pi/2
      openarm_joint2: 0.0
      openarm_joint3: -1.57              # -pi/2
      openarm_joint4: 1.57               # pi/2
      openarm_joint5: 0.0
      openarm_joint6: 0.0
      openarm_joint7: 0.0
      openarm_finger_joint1: 0.044       # gripper open
      openarm_finger_joint2: 0.044       # gripper open
    actuators:
      arm:
        joint_names: ["openarm_joint1", "openarm_joint2", "openarm_joint3", "openarm_joint4", "openarm_joint5", "openarm_joint6", "openarm_joint7"]
        stiffness: 80.0
        damping: 4.0
        effort_limit_per_joint:
          openarm_joint1: 40.0
          openarm_joint2: 40.0
          openarm_joint3: 27.0
          openarm_joint4: 27.0
          openarm_joint5: 7.0
          openarm_joint6: 7.0
          openarm_joint7: 7.0
      gripper:
        joint_names: ["openarm_finger_joint1", "openarm_finger_joint2"]
        effort_limit: 333.33          # N
        stiffness: 2000.0
        damping: 100.0
        open_position: 0.044
        close_position: 0.0
    ee_frame:
      body: openarm_hand
      tcp_frame: openarm_ee_tcp
    physics:
      self_collision: false
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]   # wxyz: Z-axis 90-degree rotation
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # Small Sektion Cabinet on table (articulated drawer)
  - name: drawer
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Sektion_Cabinet/sektion_cabinet_instanceable.usd"
    prim_path: "/World/Drawer"
    position: [0.35, 0.10, 0.12]     # right side, scaled from Franka by 0.71 ratio
    rotation: [0, 0, 0, 1]           # wxyz: 180° Z-rotation (front faces robot)
    scale: [0.3, 0.3, 0.3]           # 0.3x scale → ~24cm tall, ~18cm wide
    joints:
      door_left_joint: 0.0
      door_right_joint: 0.0
      drawer_bottom_joint: 0.0
      drawer_top_joint: 0.1           # top drawer slightly open
    actuators:
      drawers:
        joint_names: ["drawer_top_joint", "drawer_bottom_joint"]
        effort_limit: 87.0
        stiffness: 10.0
        damping: 1.0
      doors:
        joint_names: ["door_left_joint", "door_right_joint"]
        effort_limit: 87.0
        stiffness: 10.0
        damping: 2.5

  # DexCube to pick up (0.8x scaled)
  - name: cube
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/DexCube/dex_cube_instanceable.usd"
    prim_path: "/World/Object"
    position: [0.3, -0.10, 0.055]    # on table surface, left side (scaled from Franka [0.4, -0.15])
    rotation: [1, 0, 0, 0]
    scale: [0.8, 0.8, 0.8]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0    # rad/s
      max_linear_velocity: 1000.0     # m/s
      max_depenetration_velocity: 5.0 # m/s
    randomize:
      position:
        type: absolute
        x: [0.25, 0.38]              # scaled from Franka [0.35, 0.50] by 0.71 ratio
        y: [-0.18, -0.04]            # scaled from Franka [-0.25, -0.05]
        z: 0.055                      # fixed on table surface

  # Target marker on top of cabinet (green pad)
  - name: target_marker
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/TargetMarker"
    position: [0.35, 0.10, 0.245]    # on top of scaled cabinet (~0.24m tall)
    scale: [0.14, 0.10, 0.006]       # 14cm x 10cm x 6mm flat pad
    color: [0.0, 1.0, 0.0]           # bright green
    physics:
      rigid_body: false               # static visual marker only
      collision: false

goal:
  description: "Pick the DexCube from the table and place it on top of the small drawer box (green marker)"
  conditions:
    - subject: cube
      relation: at_position
      target: target_marker
      tolerance: 0.04                 # 4cm (slightly more tolerant for elevated placement)
    - subject: cube
      relation: above
      target: drawer
      description: "Cube must be on top of the drawer box"

camera:
  prim_path: "/World/Camera"
  position: [1.2, 1.0, 0.8]          # front-oblique tabletop view (OpenArm profile)
  target: [0.3, 0, 0.2]              # looking at table center (closer for OpenArm)
  fov: 60
  resolution: [1280, 720]

notes:
  - "Adapted from franka/pick_place_drawer for OpenArm (~0.6m reach vs Franka ~0.85m)"
  - "Reach ratio: 0.6/0.85 = 0.71 — spawn ranges scaled proportionally"
  - "Sektion Cabinet 0.3x scale on table, top drawer pre-opened 0.1"
  - "Cabinet rotation [0,0,0,1] wxyz = 180° Z so front faces robot"
  - "Cube starts on left side (y < 0), must be placed on top of cabinet (y > 0)"
  - "Episode 15s (longer than Franka 10s for slower OpenArm control)"
  - "Control rate: 20Hz (decimation=5) vs Franka 50Hz (decimation=2)"
  - "self_collision: false (OpenArm convention)"
  - "Ground plane at z=-1.05 (IsaacLab convention)"
