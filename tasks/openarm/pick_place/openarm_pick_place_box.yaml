# Task Document: OpenArmPickPlaceBox
# Version: 1.0.0
# Template: v2.0.0
# Description: OpenArm robot picks a YCB sugar box and places it at a target position on the table
# Reference: Adapted from franka/pick_place_box for OpenArm (~0.6m reach)

task:
  name: OpenArmPickPlaceBox
  description: "OpenArm unimanual robot picks up a YCB sugar box from one position on the table and places it at a target position marked by a green pad"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]             # m/s^2
  timestep: 0.01                     # 100 Hz simulation
  decimation: 5                      # control at 20 Hz (every 5 sim steps)
  episode_length: 15.0               # seconds
  render_interval: 2
  physx:
    bounce_threshold: 0.01           # m/s
    friction_correlation_distance: 0.00625  # m
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]          # IsaacLab convention

assets:
  # OpenArm Unimanual robot
  - name: robot
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Robots/OpenArm/openarm_unimanual/openarm_unimanual.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]           # wxyz quaternion
    initial_joints:
      openarm_joint1: 1.57
      openarm_joint2: 0.0
      openarm_joint3: -1.57
      openarm_joint4: 1.57
      openarm_joint5: 0.0
      openarm_joint6: 0.0
      openarm_joint7: 0.0
      openarm_finger_joint1: 0.044
      openarm_finger_joint2: 0.044
    actuators:
      arm:
        joint_names: ["openarm_joint1", "openarm_joint2", "openarm_joint3", "openarm_joint4", "openarm_joint5", "openarm_joint6", "openarm_joint7"]
        stiffness: 80.0
        damping: 4.0
        effort_limit_per_joint:
          openarm_joint1: 40.0
          openarm_joint2: 40.0
          openarm_joint3: 27.0
          openarm_joint4: 27.0
          openarm_joint5: 7.0
          openarm_joint6: 7.0
          openarm_joint7: 7.0
      gripper:
        joint_names: ["openarm_finger_joint1", "openarm_finger_joint2"]
        effort_limit: 333.33
        stiffness: 2000.0
        damping: 100.0
        open_position: 0.044
        close_position: 0.0
    ee_frame:
      body: openarm_hand
      tcp_frame: openarm_ee_tcp
    physics:
      self_collision: false
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # YCB Sugar Box (9.3 x 17.6 x 4.5 cm, rectangular)
  - name: box
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/YCB/Axis_Aligned_Physics/004_sugar_box.usd"
    prim_path: "/World/Object"
    position: [0.3, -0.10, 0.088]    # scaled from Franka
    rotation: [0.7071, 0.7071, 0, 0] # wxyz: 90 X-rotation to stand upright
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.25, 0.38]              # scaled from Franka [0.35, 0.50]
        y: [-0.18, -0.04]            # scaled from Franka [-0.25, -0.05]
        z: 0.088                      # fixed on table surface

  # Target placement marker (flat green pad on table)
  - name: target_marker
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/TargetMarker"
    position: [0.35, 0.10, 0.02]
    scale: [0.07, 0.07, 0.003]       # flat pad (7cm x 7cm x 3mm)
    color: [0.0, 0.8, 0.0]
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.28, 0.43]
        y: [0.04, 0.18]
        z: 0.02

goal:
  description: "Pick the sugar box and place it on the green target marker"
  conditions:
    - subject: box
      relation: at_position
      target: target_marker
      tolerance: 0.03
    - subject: box
      relation: on_surface
      target: table
      description: "Box must be placed on the table (not dropped)"

camera:
  prim_path: "/World/Camera"
  position: [1.2, 1.0, 0.8]
  target: [0.3, 0, 0.2]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Adapted from franka/pick_place_box for OpenArm (~0.6m reach)"
  - "Reach ratio: 0.71 — spawn ranges scaled proportionally"
  - "YCB 004_sugar_box (Axis_Aligned_Physics): 9.3 x 17.6 x 4.5 cm"
  - "OpenArm gripper max 0.088m > box depth 4.5cm (grippable)"
  - "Episode 15s, control at 20Hz (decimation=5)"
