# Task Document: OpenArmMultiPickPlace
# Version: 1.0.0
# Template: v2.0.0
# Description: OpenArm robot collects 3 scattered colored blocks onto a single collection zone
# Reference: Adapted from franka/multi_pick_place for OpenArm (~0.6m reach)

task:
  name: OpenArmMultiPickPlace
  description: "OpenArm unimanual robot picks up 3 scattered colored blocks and places them all onto a gold collection zone"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01
  decimation: 2                      # control at 50 Hz
  episode_length: 25.0
  render_interval: 2
  physx:
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]

assets:
  # OpenArm Unimanual robot
  - name: robot
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Robots/OpenArm/openarm_unimanual/openarm_unimanual.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    initial_joints:
      openarm_joint1: 1.57
      openarm_joint2: 0.0
      openarm_joint3: -1.57
      openarm_joint4: 1.57
      openarm_joint5: 0.0
      openarm_joint6: 0.0
      openarm_joint7: 0.0
      openarm_finger_joint1: 0.0
      openarm_finger_joint2: 0.0
    actuators:
      arm:
        joint_names: ["openarm_joint1", "openarm_joint2", "openarm_joint3", "openarm_joint4", "openarm_joint5", "openarm_joint6", "openarm_joint7"]
        stiffness: 80.0
        damping: 4.0
        effort_limit_per_joint:
          openarm_joint1: 40.0
          openarm_joint2: 40.0
          openarm_joint3: 27.0
          openarm_joint4: 27.0
          openarm_joint5: 7.0
          openarm_joint6: 7.0
          openarm_joint7: 7.0
      gripper:
        joint_names: ["openarm_finger_joint1", "openarm_finger_joint2"]
        effort_limit: 333.33
        stiffness: 2000.0
        damping: 100.0
        open_position: 0.044
        close_position: 0.0
    ee_frame:
      body: openarm_hand
      tcp_frame: openarm_ee_tcp
    physics:
      self_collision: false
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0
    randomize:
      joint_position:
        distribution: gaussian
        mean: 0.0
        std: 0.02

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # Blue block (front-left)
  - name: cube_1
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/blue_block.usd"
    prim_path: "/World/Cube_1"
    position: [0.25, -0.12, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "cube_1"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.25, 0.38]
        y: [-0.12, -0.03]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.08

  # Red block (back-right)
  - name: cube_2
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/red_block.usd"
    prim_path: "/World/Cube_2"
    position: [0.42, 0.08, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "cube_2"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.38, 0.48]
        y: [0.03, 0.12]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.08

  # Green block (center)
  - name: cube_3
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/green_block.usd"
    prim_path: "/World/Cube_3"
    position: [0.30, 0.04, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "cube_3"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.28, 0.42]
        y: [-0.04, 0.08]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.08

  # Collection zone (large flat marker)
  - name: collection_zone
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/CollectionZone"
    position: [0.42, 0.0, 0.002]
    scale: [0.12, 0.12, 0.003]
    color: [0.9, 0.7, 0.0]           # gold
    physics:
      rigid_body: false
      collision: false

goal:
  description: "Collect all three colored blocks onto the gold collection zone"
  conditions:
    - subject: cube_1
      relation: at_position
      target: collection_zone
      tolerance: 0.06
    - subject: cube_2
      relation: at_position
      target: collection_zone
      tolerance: 0.06
    - subject: cube_3
      relation: at_position
      target: collection_zone
      tolerance: 0.06
    - subject: cube_1
      relation: on_surface
      target: table
    - subject: cube_2
      relation: on_surface
      target: table
    - subject: cube_3
      relation: on_surface
      target: table

camera:
  prim_path: "/World/Camera"
  position: [1.2, 1.0, 0.8]
  target: [0.32, 0, 0.2]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Adapted from franka/multi_pick_place for OpenArm (~0.6m reach)"
  - "3 colored blocks scattered, must be collected onto 1 gold zone"
  - "Block z=0.0203m (table surface + half block height)"
  - "Each block randomized in a different quadrant to ensure scatter"
  - "Collection zone at x=0.42 vs Franka x=0.55"
  - "Ground plane at z=-1.05 (IsaacLab convention)"
  - "Control rate: 50Hz (decimation=2), episode: 25s"
