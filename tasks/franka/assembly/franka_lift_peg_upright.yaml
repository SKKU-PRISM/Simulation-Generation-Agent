# Task Document: FrankaLiftPegUpright
# Version: 1.1.0
# Template: v2.0.0
# Description: Franka robot lifts a two-tone peg (red+blue) lying flat on the table to an upright position
# Reference: ManiSkill LiftPegUpright-v1 (mani_skill/envs/tasks/tabletop/lift_peg_upright.py)

task:
  name: FrankaLiftPegUpright
  description: "Franka Panda robot grasps a two-tone peg (red+blue) lying flat on the table and lifts it into an upright (vertical) position"
  version: "1.1.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01
  decimation: 2
  episode_length: 10.0
  render_interval: 2
  physx:
    solver_type: TGS
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625
    friction_offset_threshold: 0.01
    gpu_max_rigid_contact_count: 8388608

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]

assets:
  # Franka Panda robot
  - name: robot
    type: articulation
    source: usd
    robot_type: franka
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    initial_joints:                       # Franka ready pose (gripper pointing down)
      panda_joint1: 0.0
      panda_joint2: -0.7854              # -pi/4
      panda_joint3: 0.0
      panda_joint4: -2.3562              # -3pi/4
      panda_joint5: 0.0
      panda_joint6: 1.5708               # pi/2
      panda_joint7: 0.7854               # pi/4
      panda_finger_joint: 0.04
    actuators:
      shoulder:
        joint_names: ["panda_joint1", "panda_joint2", "panda_joint3", "panda_joint4"]
        effort_limit: 87.0
        stiffness: 80.0
        damping: 4.0
      forearm:
        joint_names: ["panda_joint5", "panda_joint6", "panda_joint7"]
        effort_limit: 12.0
        stiffness: 80.0
        damping: 4.0
      hand:
        joint_names: ["panda_finger_joint.*"]
        effort_limit: 200.0
        stiffness: 2000.0
        damping: 100.0
    ee_frame:
      body: panda_hand
      offset_position: [0, 0, 0.1034]
    physics:
      self_collision: false
      solver_position_iterations: 64
      solver_velocity_iterations: 1
      max_depenetration_velocity: 5.0

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # ===== Upright peg =====
  # Use a single rigid cuboid for the peg body. The original ManiSkill task
  # uses a two-tone peg, but IsaacLab generation proved unstable when the peg
  # was modeled as two primitive rigid bodies connected by a fixed joint.
  # A single 24cm rigid peg preserves the task affordance (grasp a horizontal
  # peg and stand it upright) while keeping the simulator stable.
  - name: peg_red
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PegRed"
    position: [0.45, 0.0, 0.025]       # centered on table, lying along X
    rotation: [1, 0, 0, 0]
    scale: [0.24, 0.05, 0.05]          # 24cm x 5cm x 5cm
    color: [0.69, 0.055, 0.055]        # dark red matching ManiSkill [176, 14, 14]
    physics:
      rigid_body: true
      collision: true
      mass: 0.2
      solver_position_iterations: 32
      solver_velocity_iterations: 1
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: relative
        x: [-0.05, 0.05]
        y: [-0.10, 0.10]
        z: 0.0

goal:
  description: "Lift the two-tone peg from lying flat to an upright vertical position on the table"
  conditions:
    - subject: peg_red
      relation: upright
      target: table
      tolerance: 0.08
      description: "Peg standing upright on the table (within 0.08 rad of vertical)"

camera:
  prim_path: "/World/Camera"
  position: [0.45, 0.0, 0.90]           # normalized top-down precision view
  target: [0.45, 0.0, 0.05]
  fov: 57
  resolution: [1280, 720]

notes:
  - "Source: ManiSkill LiftPegUpright-v1 (haosulab/ManiSkill)"
  - "USD Cube size=1.0, scale is full edge length (not half-size)"
  - "Peg is represented as a single 24cm rigid cuboid for simulator stability"
  - "Peg lies flat on table initially, robot must lift it to vertical"
  - "Success: peg upright (euler_z within 0.08 rad of pi/2) and z at half-length"
  - "Franka gripper max opening 0.08m > peg cross-section 0.05m (grippable)"
