# Task Document: FrankaLiftPegUpright
# Version: 1.1.0
# Template: v2.0.0
# Description: Franka robot lifts a two-tone peg (red+blue) lying flat on the table to an upright position
# Reference: ManiSkill LiftPegUpright-v1 (mani_skill/envs/tasks/tabletop/lift_peg_upright.py)

task:
  name: FrankaLiftPegUpright
  description: "Franka Panda robot grasps a two-tone peg (red+blue) lying flat on the table and lifts it into an upright (vertical) position"
  version: "1.1.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01
  decimation: 2
  episode_length: 10.0
  render_interval: 2
  physx:
    solver_type: TGS
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625
    friction_offset_threshold: 0.01
    gpu_max_rigid_contact_count: 8388608

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]

assets:
  # Franka Panda robot
  - name: robot
    type: articulation
    source: usd
    robot_type: franka
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    initial_joints:                       # Franka ready pose (gripper pointing down)
      panda_joint1: 0.0
      panda_joint2: -0.7854              # -pi/4
      panda_joint3: 0.0
      panda_joint4: -2.3562              # -3pi/4
      panda_joint5: 0.0
      panda_joint6: 1.5708               # pi/2
      panda_joint7: 0.7854               # pi/4
      panda_finger_joint: 0.04
    actuators:
      shoulder:
        joint_names: ["panda_joint1", "panda_joint2", "panda_joint3", "panda_joint4"]
        effort_limit: 87.0
        stiffness: 80.0
        damping: 4.0
      forearm:
        joint_names: ["panda_joint5", "panda_joint6", "panda_joint7"]
        effort_limit: 12.0
        stiffness: 80.0
        damping: 4.0
      hand:
        joint_names: ["panda_finger_joint.*"]
        effort_limit: 200.0
        stiffness: 2000.0
        damping: 100.0
    ee_frame:
      body: panda_hand
      offset_position: [0, 0, 0.1034]
    physics:
      self_collision: false
      solver_position_iterations: 64
      solver_velocity_iterations: 1
      max_depenetration_velocity: 5.0

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # ===== Two-tone Peg: red + blue, lying flat on table =====
  # ManiSkill peg: diameter 5cm, total length 24cm (2 halves of 12cm)
  # Using cube primitives: cross-section 5cm x 5cm, each half 12cm long
  # Peg lies flat along X-axis on table surface

  # Red half (-X side)
  - name: peg_red
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PegRed"
    position: [0.39, 0.0, 0.025]       # on table, left half of peg
    rotation: [1, 0, 0, 0]
    scale: [0.12, 0.05, 0.05]          # 12cm x 5cm x 5cm
    color: [0.69, 0.055, 0.055]        # dark red matching ManiSkill [176, 14, 14]
    physics:
      rigid_body: true
      collision: true
      mass: 0.1
      solver_position_iterations: 32
      solver_velocity_iterations: 1
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: relative
        x: [-0.05, 0.05]
        y: [-0.10, 0.10]
        z: 0.0

  # Blue half (+X side)
  - name: peg_blue
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PegBlue"
    position: [0.51, 0.0, 0.025]       # on table, right half of peg (adjacent to red)
    rotation: [1, 0, 0, 0]
    scale: [0.12, 0.05, 0.05]          # 12cm x 5cm x 5cm
    color: [0.047, 0.165, 0.627]       # blue matching ManiSkill [12, 42, 160]
    physics:
      rigid_body: true
      collision: true
      mass: 0.1
      solver_position_iterations: 32
      solver_velocity_iterations: 1
      max_depenetration_velocity: 5.0

constraints:
  - name: PegFixedJoint
    type: fixed_joint
    parent: /World/PegRed
    child: /World/PegBlue
    local_pos0: [0.06, 0, 0]            # red right edge (half of scale_x 0.12)
    local_pos1: [-0.06, 0, 0]           # blue left edge
    description: "Lock two peg halves together as a single rigid body"

goal:
  description: "Lift the two-tone peg from lying flat to an upright vertical position on the table"
  conditions:
    - subject: peg_red
      relation: upright
      target: table
      tolerance: 0.08
      description: "Peg standing upright on the table (within 0.08 rad of vertical)"

camera:
  prim_path: "/World/Camera"
  position: [0.15, 0.55, 0.45]          # front-left oblique, balanced view of both peg halves
  target: [0.45, 0.0, 0.05]
  fov: 57
  resolution: [1280, 720]

notes:
  - "Source: ManiSkill LiftPegUpright-v1 (haosulab/ManiSkill)"
  - "USD Cube size=1.0, scale is full edge length (not half-size)"
  - "Peg: two-tone (red 12cm + blue 12cm), cross-section 5cm x 5cm"
  - "Peg lies flat on table initially, robot must lift to vertical"
  - "Success: peg upright (euler_z within 0.08 rad of pi/2) and z at half-length"
  - "Franka gripper max opening 0.08m > peg cross-section 0.05m (grippable)"
