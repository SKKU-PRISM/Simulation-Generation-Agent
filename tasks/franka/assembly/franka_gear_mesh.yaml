# Task Document: FrankaGearMesh
# Description: Franka robot meshes a grasped medium gear onto a gear base shaft on a table

task:
  name: FrankaGearMesh
  description: "Mesh a medium gear onto the gear base shaft on the table. The Franka robot starts with the medium gear already grasped, positioned above the gear base. The robot must align the gear with the shaft and push it down so the teeth interlock."
  category: assembly
  initial_grasp:
    held_object: medium_gear
    fixed_object: gear_base
    grasp_width: 0.01875
    held_asset:
      height: 0.03
      diameter: 0.03
    fixed_asset:
      height: 0.02
      base_height: 0.005
      medium_gear_base_offset: [0.02025, 0.0, 0.0]
    fingerpad_length: 0.017608
    hand_initialization:
      position_above_fixed: [0.0, 0.0, 0.105]
      position_noise: [0.0, 0.0, 0.0]
      orientation_euler: [3.1416, 0.0, 0.0]
      orientation_noise: [0.0, 0.0, 0.0]
    fixed_object_randomization:
      position_noise: [0.0, 0.0, 0.0]
      orientation_range_deg: 0.0
    held_object_randomization:
      position_noise: [0.0, 0.0, 0.0]
      initial_rotation_deg: 0.0

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01
  decimation: 5
  episode_length: 60.0
  render_interval: 2
  physx:
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]
  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]

assets:
  - name: robot
    type: articulation
    source: usd
    robot_type: franka
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    initial_joints:
      panda_joint1: 0.0
      panda_joint2: -0.7854
      panda_joint3: 0.0
      panda_joint4: -2.3562
      panda_joint5: 0.0
      panda_joint6: 1.5708
      panda_joint7: 0.7854
      panda_finger_joint: 0.04
    actuators:
      shoulder:
        joint_names: ["panda_joint1", "panda_joint2", "panda_joint3", "panda_joint4"]
        effort_limit: 87.0
        stiffness: 80.0
        damping: 4.0
      forearm:
        joint_names: ["panda_joint5", "panda_joint6", "panda_joint7"]
        effort_limit: 12.0
        stiffness: 80.0
        damping: 4.0
      hand:
        joint_names: ["panda_finger_joint.*"]
        effort_limit: 200.0
        stiffness: 2000.0
        damping: 100.0
    ee_frame:
      body: panda_hand
      offset_position: [0, 0, 0.1034]
    physics:
      self_collision: true
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0

  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]
    physics:
      collision: true

  # Gear base (fixed target on table)
  - name: gear_base
    type: rigid
    role: fixed_target
    source: usd
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Factory/factory_gear_base.usd"
    prim_path: "/World/GearBase"
    position: [0.5, 0.0, 0.02]
    rotation: [1, 0, 0, 0]
    physics:
      rigid_body: false
      collision: true

  # Medium gear (held object, teleported into gripper)
  - name: medium_gear
    type: rigid
    role: held_object
    source: usd
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Factory/factory_gear_medium.usd"
    prim_path: "/World/MediumGear"
    position: [0.5, 0.2, 0.05]
    rotation: [1, 0, 0, 0]
    physics:
      rigid_body: true
      collision: true
      mass: 0.012

goal:
  description: "Mesh the medium gear onto the gear base shaft so teeth interlock"
  conditions:
    - type: inserted_into
      subject: medium_gear
      target: gear_base
  success_criteria:
    type: insertion_depth
    insertion_depth_fraction: 0.95
    xy_threshold: 0.0025
    fixed_asset_height: 0.02

notes:
  - "Medium gear is teleported into gripper at episode start via initial_grasp config"
  - "Gear base is a fixed target on the table surface"
  - "Ground plane at z=-1.05 (IsaacLab convention)"
