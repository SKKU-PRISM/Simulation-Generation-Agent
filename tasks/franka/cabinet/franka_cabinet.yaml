# Task Document: FrankaCabinet
# Version: 1.1.0
# Template: v2.0.0
# Description: Franka robot opens the top drawer of a Sektion Cabinet
# Reference: IsaacLab cabinet_env_cfg.py, config/franka/joint_pos_env_cfg.py

task:
  name: FrankaCabinet
  description: "Franka Panda robot approaches the top drawer handle, grasps it, and pulls to open the drawer"
  version: "1.1.0"

simulation:
  gravity: [0, 0, -9.81]             # m/s^2
  timestep: 0.01667                  # 1/60s, 60 Hz simulation
  decimation: 1                      # control at 60 Hz (every sim step)
  episode_length: 8.0                # seconds
  render_interval: 1
  physx:
    solver_type: TGS                 # Temporal Gauss-Seidel
    bounce_threshold: 0.01           # m/s
    friction_correlation_distance: 0.00625  # m

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, 0]              # GroundPlaneCfg default (다른 task들은 z=-1.05)

assets:
  # Franka Panda robot
  - name: robot
    type: articulation
    source: usd
    robot_type: franka
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]           # wxyz quaternion
    initial_joints:                       # Franka ready pose (gripper pointing down)
      panda_joint1: 0.0
      panda_joint2: -0.7854              # -pi/4
      panda_joint3: 0.0
      panda_joint4: -2.3562              # -3pi/4
      panda_joint5: 0.0
      panda_joint6: 1.5708               # pi/2
      panda_joint7: 0.7854               # pi/4
      panda_finger_joint: 0.04           # gripper open
    actuators:
      shoulder:
        joint_names: ["panda_joint1", "panda_joint2", "panda_joint3", "panda_joint4"]
        effort_limit: 87.0            # N*m
        stiffness: 80.0               # N*m/rad
        damping: 4.0                  # N*m*s/rad
      forearm:
        joint_names: ["panda_joint5", "panda_joint6", "panda_joint7"]
        effort_limit: 12.0            # N*m
        stiffness: 80.0
        damping: 4.0
      hand:
        joint_names: ["panda_finger_joint.*"]
        effort_limit: 200.0           # N
        stiffness: 2000.0             # N/m
        damping: 100.0                # N*s/m
    ee_frame:
      body: panda_hand
      offset_position: [0, 0, 0.1034] # m, TCP above hand frame
      tool_frames:
        - name: tool_leftfinger
          body: panda_leftfinger
          offset_position: [0, 0, 0.046]
        - name: tool_rightfinger
          body: panda_rightfinger
          offset_position: [0, 0, 0.046]
    physics:
      self_collision: true
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0
    randomize:
      joint_position:
        distribution: uniform
        range: [-0.1, 0.1]           # rad, at episode reset
      physics_material:
        body_names: ".*"
        static_friction: [0.8, 1.25]
        dynamic_friction: [0.8, 1.25]
        restitution: [0.0, 0.0]
        num_buckets: 16

  # Sektion Cabinet (articulated: doors + drawers)
  - name: cabinet
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Sektion_Cabinet/sektion_cabinet_instanceable.usd"
    prim_path: "/World/Cabinet"
    position: [0.8, 0.0, 0.4]
    rotation: [0, 0, 0, 1]           # wxyz quaternion: 180° Z-rotation (front faces robot)
    joints:
      door_left_joint: 0.0
      door_right_joint: 0.0
      drawer_bottom_joint: 0.0
      drawer_top_joint: 0.0           # target joint to open
    actuators:
      drawers:
        joint_names: ["drawer_top_joint", "drawer_bottom_joint"]
        effort_limit: 87.0            # N*m
        stiffness: 10.0
        damping: 1.0
      doors:
        joint_names: ["door_left_joint", "door_right_joint"]
        effort_limit: 87.0            # N*m
        stiffness: 10.0
        damping: 2.5
    handle:
      name: drawer_handle_top
      prim_path: "/World/Cabinet/drawer_handle_top"
      offset_position: [0.305, 0.0, 0.01]  # m, from handle frame
      offset_rotation: [0.5, 0.5, -0.5, -0.5]  # wxyz, aligned for EE grasping
    randomize:
      physics_material:
        body_names: "drawer_handle_top"
        static_friction: [1.0, 1.25]
        dynamic_friction: [1.25, 1.5]
        restitution: [0.0, 0.0]
        num_buckets: 16

goal:
  description: "Open the top drawer of the cabinet by grasping the handle and pulling"
  conditions:
    - subject: drawer_top_joint
      relation: position_above
      value: 0.01                     # easy threshold (m)
    - subject: drawer_top_joint
      relation: position_above
      value: 0.2                      # medium threshold (m)
    - subject: drawer_top_joint
      relation: position_above
      value: 0.3                      # hard threshold (m)

camera:
  prim_path: "/World/Camera"
  position: [0.65, 0.0, 1.30]            # normalized top-down view covering robot-cabinet workspace
  target: [0.65, 0.0, 0.45]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Values from IsaacLab cabinet_env_cfg.py and config/franka/joint_pos_env_cfg.py"
  - "Cabinet at [0.8, 0, 0.4] with 4 joints: 2 doors + 2 drawers"
  - "Target: drawer_top_joint, handle offset [0.305, 0, 0.01] from drawer_handle_top frame"
  - "Control rate: 60Hz (decimation=1), episode: 8s, PhysX solver: TGS"
  - "Robot friction randomized at startup with 16 buckets (all bodies)"
  - "Cabinet handle friction randomized at startup with 16 buckets"
  - "Robot joint positions randomized +-0.1 rad (uniform) at episode reset"
  - "Cabinet rotation is 180° Z-rotation (wxyz=[0,0,0,1]), front faces robot at origin"
