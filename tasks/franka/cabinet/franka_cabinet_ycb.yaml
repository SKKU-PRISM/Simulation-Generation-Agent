# Task Document: FrankaCabinetYCB
# Version: 1.0.0
# Description: Franka robot with Sektion Cabinet and 3 YCB objects (mug, soup can, mustard bottle)

task:
  name: FrankaCabinetYCB
  description: "Franka picks 3 YCB objects (mug, soup can, mustard bottle) from cabinet top and places them on a target zone"
  version: "1.1.0"

simulation:
  gravity: [0, 0, -9.81]
  timestep: 0.01667
  decimation: 1
  episode_length: 30.0
  render_interval: 1
  physx:
    solver_type: TGS
    bounce_threshold: 0.01
    friction_correlation_distance: 0.00625

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, 0]

assets:
  # Franka Panda robot
  - name: robot
    type: articulation
    source: usd
    robot_type: franka
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]
    initial_joints:
      panda_joint1: 0.0
      panda_joint2: -0.7854
      panda_joint3: 0.0
      panda_joint4: -2.3562
      panda_joint5: 0.0
      panda_joint6: 1.5708
      panda_joint7: 0.7854
      panda_finger_joint: 0.04

  # Sektion Cabinet (full size)
  - name: cabinet
    type: articulation
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Sektion_Cabinet/sektion_cabinet_instanceable.usd"
    prim_path: "/World/Cabinet"
    position: [0.8, 0.0, 0.4]
    rotation: [0, 0, 0, 1]
    joints:
      door_left_joint: 0.0
      door_right_joint: 0.0
      drawer_bottom_joint: 0.0
      drawer_top_joint: 0.0

  # YCB Mug on cabinet top (0.6x scale, -90X to stand up)
  - name: mug
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/YCB/Axis_Aligned/025_mug.usd"
    prim_path: "/World/Mug"
    position: [0.7, -0.15, 0.826]
    rotation: [0.7071, -0.7071, 0, 0]
    scale: [0.6, 0.6, 0.6]
    physics:
      rigid_body: true
      collision: true
    randomize:
      position:
        type: absolute
        x: [0.60, 0.82]
        y: [-0.20, 0.20]
        z: 0.826
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # YCB Tomato Soup Can on cabinet top (0.6x scale, -90X to stand up)
  - name: tomato_soup_can
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/YCB/Axis_Aligned/005_tomato_soup_can.usd"
    prim_path: "/World/TomatoSoupCan"
    position: [0.8, 0.0, 0.833]
    rotation: [0.7071, -0.7071, 0, 0]
    scale: [0.6, 0.6, 0.6]
    physics:
      rigid_body: true
      collision: true
    randomize:
      position:
        type: absolute
        x: [0.60, 0.82]
        y: [-0.20, 0.20]
        z: 0.833
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # YCB Mustard Bottle on cabinet top (0.6x scale, -90X to stand up)
  - name: mustard_bottle
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/YCB/Axis_Aligned/006_mustard_bottle.usd"
    prim_path: "/World/MustardBottle"
    position: [0.9, 0.15, 0.860]
    rotation: [0.7071, -0.7071, 0, 0]
    scale: [0.6, 0.6, 0.6]
    physics:
      rigid_body: true
      collision: true
    randomize:
      position:
        type: absolute
        x: [0.60, 0.82]
        y: [-0.20, 0.20]
        z: 0.860
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # Target zone on floor (gold flat pad between robot and cabinet)
  - name: target_zone
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/TargetZone"
    position: [0.4, 0.0, 0.003]
    scale: [0.15, 0.15, 0.003]              # 15cm x 15cm x 3mm flat pad
    color: [0.85, 0.65, 0.13]               # gold
    physics:
      rigid_body: false
      collision: false

goal:
  description: "Pick all 3 YCB objects from cabinet top and place them on the target zone"
  conditions:
    - subject: mug
      relation: at_position
      target: target_zone
      tolerance: 0.05
    - subject: tomato_soup_can
      relation: at_position
      target: target_zone
      tolerance: 0.05
    - subject: mustard_bottle
      relation: at_position
      target: target_zone
      tolerance: 0.05

camera:
  prim_path: "/World/Camera"
  position: [0.8, 1.3, 1.6]
  target: [0.8, 0.0, 0.5]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Cabinet top z=0.802, all objects 0.6x scale for graspability"
  - "Soup can/mustard rotated -90 X (Y-up→Z-up), mug already upright"
  - "Scaled sizes: mug 5.6cm, can 4.1cm dia, mustard 3.5cm thin - all fit 8cm gripper"
  - "Objects are rigid (graspable), must be picked from elevated cabinet top"
  - "Target zone on floor at [0.4, 0, 0.003] between robot and cabinet"
  - "Episode 30s for 3 sequential pick-place cycles from elevated surface"
  - "Randomization x=[0.60,0.82] constrained by Franka workspace envelope x_max=0.85"
