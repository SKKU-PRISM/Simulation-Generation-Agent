# Task Document: FrankaStackTray
# Version: 1.0.0
# Template: v2.0.0
# Description: Franka robot stacks 3 colored cubes inside a tray on the table
# Reference: Based on franka/stack with added tray (bin) constraint

task:
  name: FrankaStackTray
  description: "Franka Panda robot picks up colored cubes and stacks them inside a tray on the table in order: Blue (bottom) -> Red (middle) -> Green (top)"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]             # m/s^2
  timestep: 0.01                     # 100 Hz simulation
  decimation: 5                      # control at 20 Hz (every 5 sim steps)
  episode_length: 30.0               # seconds
  render_interval: 2
  physx:
    bounce_threshold: 0.01           # m/s
    friction_correlation_distance: 0.00625  # m
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]          # IsaacLab convention

assets:
  # Franka Panda robot
  - name: robot
    type: articulation
    source: usd
    robot_type: franka
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]           # wxyz quaternion
    initial_joints:
      panda_joint1: 0.0
      panda_joint2: -0.7854
      panda_joint3: 0.0
      panda_joint4: -2.3562
      panda_joint5: 0.0
      panda_joint6: 1.5708
      panda_joint7: 0.7854
      panda_finger_joint: 0.04
    actuators:
      shoulder:
        joint_names: ["panda_joint1", "panda_joint2", "panda_joint3", "panda_joint4"]
        effort_limit: 87.0
        stiffness: 80.0
        damping: 4.0
      forearm:
        joint_names: ["panda_joint5", "panda_joint6", "panda_joint7"]
        effort_limit: 12.0
        stiffness: 80.0
        damping: 4.0
      hand:
        joint_names: ["panda_finger_joint.*"]
        effort_limit: 200.0
        stiffness: 2000.0
        damping: 100.0
    ee_frame:
      body: panda_hand
      offset_position: [0, 0, 0.1034]
    physics:
      self_collision: true
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0
    randomize:
      joint_position:
        distribution: gaussian
        mean: 0.0
        std: 0.02

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # === Tray (bin): base + 4 walls ===
  # Inner area: 16cm x 16cm, wall height: 6cm, wall thickness: 5mm
  # Tray center: [0.5, 0, 0] on table

  - name: tray_base
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/Tray/Base"
    position: [0.5, 0.0, 0.002]      # 2mm above table (half of 4mm thickness)
    scale: [0.17, 0.17, 0.004]       # 17cm x 17cm x 4mm
    color: [0.65, 0.50, 0.30]        # light wood
    physics:
      rigid_body: false
      collision: true

  - name: tray_wall_front
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/Tray/WallFront"
    position: [0.585, 0.0, 0.034]    # front edge (0.5 + 0.08 + 0.005)
    scale: [0.005, 0.17, 0.06]       # 5mm x 17cm x 6cm
    color: [0.65, 0.50, 0.30]
    physics:
      rigid_body: false
      collision: true

  - name: tray_wall_back
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/Tray/WallBack"
    position: [0.415, 0.0, 0.034]    # back edge (0.5 - 0.08 - 0.005)
    scale: [0.005, 0.17, 0.06]
    color: [0.65, 0.50, 0.30]
    physics:
      rigid_body: false
      collision: true

  - name: tray_wall_left
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/Tray/WallLeft"
    position: [0.5, -0.085, 0.034]   # left edge (0 - 0.08 - 0.005)
    scale: [0.17, 0.005, 0.06]
    color: [0.65, 0.50, 0.30]
    physics:
      rigid_body: false
      collision: true

  - name: tray_wall_right
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/Tray/WallRight"
    position: [0.5, 0.085, 0.034]    # right edge (0 + 0.08 + 0.005)
    scale: [0.17, 0.005, 0.06]
    color: [0.65, 0.50, 0.30]
    physics:
      rigid_body: false
      collision: true

  # === Cubes (spawn OUTSIDE tray, must stack INSIDE) ===

  - name: cube_1
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/blue_block.usd"
    prim_path: "/World/Cube_1"
    position: [0.4, -0.2, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "cube_1"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.35, 0.65]
        y: [-0.30, -0.15]            # left of tray
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.08

  - name: cube_2
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/red_block.usd"
    prim_path: "/World/Cube_2"
    position: [0.55, -0.2, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "cube_2"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.35, 0.65]
        y: [-0.30, -0.15]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.08

  - name: cube_3
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/green_block.usd"
    prim_path: "/World/Cube_3"
    position: [0.60, -0.25, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "cube_3"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.35, 0.65]
        y: [-0.30, -0.15]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.08

goal:
  description: "Stack cubes inside the tray in order: Blue (bottom) -> Red (middle) -> Green (top)"
  success_criteria:
    xy_threshold: 0.04
    height_diff: 0.0468
    height_threshold: 0.005
    gripper_must_be_open: true
    inside_tray: true                 # cubes must be within tray bounds
    tray_center: [0.5, 0.0]
    tray_half_extent: 0.08            # 8cm from center

camera:
  prim_path: "/World/Camera"
  position: [0.25, 0.0, 1.05]            # normalized top-down view centered on tray workspace
  target: [0.25, 0.0, 0.05]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Based on franka/stack with added tray (bin) constraint"
  - "Tray: 16cm x 16cm inner area, 6cm wall height, 5mm wall thickness"
  - "Cubes spawn OUTSIDE tray (y < -0.15), must be stacked INSIDE tray"
  - "Tray adds spatial constraint — robot must place precisely within walls"
  - "Same stacking order and physics as standard stack task"
  - "Control rate: 20Hz (decimation=5), episode: 30s"
