# Task Document: FrankaPickPlaceTuna
# Version: 1.0.0
# Template: v2.0.0
# Description: Franka robot picks a YCB tuna fish can and places it at a target position on the table
# Reference: Based on franka_pick_place_can.yaml with YCB tuna fish can

task:
  name: FrankaPickPlaceTuna
  description: "Franka Panda robot picks up a flat YCB tuna fish can from one position on the table and places it at a target position marked by a green pad"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]             # m/s^2
  timestep: 0.01                     # 100 Hz simulation
  decimation: 2                      # control at 50 Hz (every 2 sim steps)
  episode_length: 8.0                # seconds
  render_interval: 2
  physx:
    bounce_threshold: 0.01           # m/s
    friction_correlation_distance: 0.00625  # m
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]          # IsaacLab convention

assets:
  # Franka Panda robot
  - name: robot
    type: articulation
    source: usd
    robot_type: franka
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]           # wxyz quaternion
    initial_joints:
      panda_joint1: 0.0
      panda_joint2: -0.7854              # -pi/4
      panda_joint3: 0.0
      panda_joint4: -2.3562              # -3pi/4
      panda_joint5: 0.0
      panda_joint6: 1.5708               # pi/2
      panda_joint7: 0.7854               # pi/4
      panda_finger_joint: 0.04           # gripper open
    actuators:
      shoulder:
        joint_names: ["panda_joint1", "panda_joint2", "panda_joint3", "panda_joint4"]
        effort_limit: 87.0
        stiffness: 80.0
        damping: 4.0
      forearm:
        joint_names: ["panda_joint5", "panda_joint6", "panda_joint7"]
        effort_limit: 12.0
        stiffness: 80.0
        damping: 4.0
      hand:
        joint_names: ["panda_finger_joint.*"]
        effort_limit: 200.0
        stiffness: 2000.0
        damping: 100.0
    ee_frame:
      body: panda_hand
      offset_position: [0, 0, 0.1034]
    physics:
      self_collision: true
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]   # wxyz: Z-axis 90-degree rotation
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # YCB Tuna Fish Can (8.6 x 3.4 x 8.6 cm, flat cylindrical)
  - name: can
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/YCB/Axis_Aligned/007_tuna_fish_can.usd"
    prim_path: "/World/Object"
    position: [0.4, -0.15, 0.015]    # on table surface (half height = 1.53cm after 0.9x scale)
    rotation: [0.7071, 0.7071, 0, 0] # wxyz: 90 X-rotation to stand upright (USD default height axis is Y)
    scale: [0.9, 0.9, 0.9]           # 0.9x scale: 7.7 x 3.1 x 7.7 cm — fits Franka gripper 8cm
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.35, 0.50]              # left half of table
        y: [-0.25, -0.05]
        z: 0.015                      # fixed on table surface (0.9x scaled)

  # Target placement marker (flat green pad on table)
  - name: target_marker
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/TargetMarker"
    position: [0.5, 0.15, 0.02]      # on table surface, right side
    scale: [0.06, 0.06, 0.003]       # flat pad (6cm x 6cm x 3mm)
    color: [0.0, 0.8, 0.0]           # green
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.40, 0.60]
        y: [0.05, 0.25]
        z: 0.02

goal:
  description: "Pick the tuna fish can and place it on the green target marker"
  conditions:
    - subject: can
      relation: at_position
      target: target_marker
      tolerance: 0.03                 # 3cm
    - subject: can
      relation: on_surface
      target: table
      description: "Can must be placed on the table (not dropped)"

camera:
  prim_path: "/World/Camera"
  position: [0.5, 0.0, 1.05]         # normalized top-down tabletop view
  target: [0.5, 0.0, 0.05]
  fov: 60
  resolution: [1280, 720]

notes:
  - "YCB 007_tuna_fish_can (Axis_Aligned, no built-in physics): original 8.6 x 3.4 x 8.6 cm"
  - "Scaled 0.9x to fit Franka gripper: 7.7 x 3.1 x 7.7 cm (diameter 7.7cm < gripper 8cm)"
  - "Very flat can (only 3.1cm tall after scaling) — requires top-down grip approach"
  - "Can initial z=0.015m (half of 3.1cm scaled height, upright on table)"
  - "Low profile object — different grip strategy than taller cans/bottles"
  - "Episode 8s (standard pick-place duration)"
