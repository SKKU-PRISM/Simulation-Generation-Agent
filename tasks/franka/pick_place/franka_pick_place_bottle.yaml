# Task Document: FrankaPickPlaceBottle
# Version: 1.0.0
# Template: v2.0.0
# Description: Franka robot picks a YCB mustard bottle and places it at a target position on the table
# Reference: Based on franka_pick_place_can.yaml with YCB mustard bottle

task:
  name: FrankaPickPlaceBottle
  description: "Franka Panda robot picks up a YCB mustard bottle from one position on the table and places it at a target position marked by a green pad"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]             # m/s^2
  timestep: 0.01                     # 100 Hz simulation
  decimation: 2                      # control at 50 Hz (every 2 sim steps)
  episode_length: 10.0               # seconds (longer than can — bottle is taller/heavier)
  render_interval: 2
  physx:
    bounce_threshold: 0.01           # m/s
    friction_correlation_distance: 0.00625  # m
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]          # IsaacLab convention

assets:
  # Franka Panda robot
  - name: robot
    type: articulation
    source: usd
    robot_type: franka
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]           # wxyz quaternion
    initial_joints:
      panda_joint1: 0.0
      panda_joint2: -0.7854              # -pi/4
      panda_joint3: 0.0
      panda_joint4: -2.3562              # -3pi/4
      panda_joint5: 0.0
      panda_joint6: 1.5708               # pi/2
      panda_joint7: 0.7854               # pi/4
      panda_finger_joint: 0.04           # gripper open
    actuators:
      shoulder:
        joint_names: ["panda_joint1", "panda_joint2", "panda_joint3", "panda_joint4"]
        effort_limit: 87.0
        stiffness: 80.0
        damping: 4.0
      forearm:
        joint_names: ["panda_joint5", "panda_joint6", "panda_joint7"]
        effort_limit: 12.0
        stiffness: 80.0
        damping: 4.0
      hand:
        joint_names: ["panda_finger_joint.*"]
        effort_limit: 200.0
        stiffness: 2000.0
        damping: 100.0
    ee_frame:
      body: panda_hand
      offset_position: [0, 0, 0.1034]
    physics:
      self_collision: true
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]   # wxyz: Z-axis 90-degree rotation
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # YCB Mustard Bottle (9.6 x 19.1 x 5.8 cm, asymmetric shape)
  - name: bottle
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/YCB/Axis_Aligned_Physics/006_mustard_bottle.usd"
    prim_path: "/World/Object"
    position: [0.4, -0.15, 0.096]    # on table surface (half height = 9.6cm)
    rotation: [0.7071, 0.7071, 0, 0] # wxyz: 90 X-rotation to stand upright (USD default height axis is Y)
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.35, 0.50]              # left half of table
        y: [-0.25, -0.05]
        z: 0.096                      # fixed on table surface

      mass:
        distribution: uniform
        operation: scale
        range: [0.8, 1.2]            # ±20% mass randomization
  # Target placement marker (flat green pad on table)
  - name: target_marker
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/TargetMarker"
    position: [0.5, 0.15, 0.02]      # on table surface, right side
    scale: [0.08, 0.08, 0.003]       # flat pad (8cm x 8cm x 3mm, larger for bottle)
    color: [0.0, 0.8, 0.0]           # green
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.40, 0.60]
        y: [0.05, 0.25]
        z: 0.02

goal:
  description: "Pick the mustard bottle and place it on the green target marker"
  conditions:
    - subject: bottle
      relation: at_position
      target: target_marker
      tolerance: 0.04                 # 4cm (slightly larger for bottle)
    - subject: bottle
      relation: on_surface
      target: table
      description: "Bottle must be placed on the table (not dropped)"

camera:
  prim_path: "/World/Camera"
  position: [0.5, 0.0, 1.05]         # normalized top-down tabletop view
  target: [0.5, 0.0, 0.05]
  fov: 60
  resolution: [1280, 720]

notes:
  - "YCB 006_mustard_bottle (Axis_Aligned_Physics): 9.6 x 19.1 x 5.8 cm"
  - "Asymmetric shape with high center of mass — more challenging than box/can"
  - "Franka gripper max 8cm > bottle depth 5.8cm (grippable from narrow side)"
  - "Bottle initial z=0.096m (half of 19.1cm height, upright on table)"
  - "Larger target pad (8cm) to accommodate bottle base footprint"
  - "Episode 10s (longer than can 8s — taller object needs more care)"
