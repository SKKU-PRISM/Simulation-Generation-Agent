# Task Document: FrankaPickPlace
# Version: 1.0.0
# Template: v2.0.0
# Description: Franka robot picks a DexCube and places it at a target position on the table
# Reference: Based on IsaacLab lift_env_cfg.py (Franka PnP not available in IsaacLab)

task:
  name: FrankaPickPlace
  description: "Franka Panda robot picks up a DexCube from one position on the table and places it at a target position marked by a green pad"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]             # m/s^2
  timestep: 0.01                     # 100 Hz simulation
  decimation: 2                      # control at 50 Hz (every 2 sim steps)
  episode_length: 8.0                # seconds (longer than lift for pick + transport + place)
  render_interval: 2
  physx:
    bounce_threshold: 0.01           # m/s
    friction_correlation_distance: 0.00625  # m
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]          # IsaacLab convention

assets:
  # Franka Panda robot (FRANKA_PANDA_CFG global default)
  - name: robot
    type: articulation
    source: usd
    robot_type: franka
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]           # wxyz quaternion
    initial_joints:                       # Franka ready pose (gripper pointing down)
      panda_joint1: 0.0
      panda_joint2: -0.7854              # -pi/4
      panda_joint3: 0.0
      panda_joint4: -2.3562              # -3pi/4
      panda_joint5: 0.0
      panda_joint6: 1.5708               # pi/2
      panda_joint7: 0.7854               # pi/4
      panda_finger_joint: 0.04           # gripper open
    actuators:
      shoulder:
        joint_names: ["panda_joint1", "panda_joint2", "panda_joint3", "panda_joint4"]
        effort_limit: 87.0            # N*m
        stiffness: 80.0               # N*m/rad
        damping: 4.0                  # N*m*s/rad
      forearm:
        joint_names: ["panda_joint5", "panda_joint6", "panda_joint7"]
        effort_limit: 12.0            # N*m
        stiffness: 80.0
        damping: 4.0
      hand:
        joint_names: ["panda_finger_joint.*"]
        effort_limit: 200.0           # N
        stiffness: 2000.0             # N/m
        damping: 100.0                # N*s/m
    ee_frame:
      body: panda_hand
      offset_position: [0, 0, 0.1034] # m, TCP above hand frame
    physics:
      self_collision: true
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0

  # SeattleLabTable (same as lift)
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]   # wxyz: Z-axis 90-degree rotation
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # DexCube to pick up (same object as lift, 0.8x scaled)
  - name: cube
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/DexCube/dex_cube_instanceable.usd"
    prim_path: "/World/Object"
    position: [0.4, -0.15, 0.055]    # on table surface, left side
    rotation: [1, 0, 0, 0]
    scale: [0.8, 0.8, 0.8]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0    # rad/s
      max_linear_velocity: 1000.0     # m/s
      max_depenetration_velocity: 5.0 # m/s
    randomize:
      position:
        type: absolute
        x: [0.35, 0.50]              # left half of table
        y: [-0.25, -0.05]
        z: 0.055                      # fixed on table surface

      mass:
        distribution: uniform
        operation: scale
        range: [0.8, 1.2]            # ±20% mass randomization
  # Target placement marker (flat green pad on table)
  - name: target_marker
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/TargetMarker"
    position: [0.5, 0.15, 0.02]      # on table surface, right side
    scale: [0.06, 0.06, 0.003]       # flat pad (6cm x 6cm x 3mm)
    color: [0.0, 0.8, 0.0]           # green
    physics:
      rigid_body: false               # static visual marker only
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.40, 0.60]              # right half of table
        y: [0.05, 0.25]
        z: 0.02                       # fixed on table surface

goal:
  description: "Pick the DexCube and place it on the green target marker"
  conditions:
    - subject: cube
      relation: at_position
      target: target_marker
      tolerance: 0.03                 # 3cm (within the 6cm marker area)
    - subject: cube
      relation: on_surface
      target: table
      description: "Cube must be placed on the table (not dropped)"

camera:
  prim_path: "/World/Camera"
  position: [0.5, 0.0, 1.05]         # normalized top-down tabletop view
  target: [0.5, 0.0, 0.05]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Based on IsaacLab lift task (Franka PnP not available in IsaacLab)"
  - "Same robot, table, physics config as lift task"
  - "DexCube at 0.8x scale, initial z=0.055m (table surface height)"
  - "Pick zone: left side of table (y < 0), place zone: right side (y > 0)"
  - "Target marker is a flat 6cm green pad, randomized on right half of table"
  - "Episode 8s (longer than lift 5s for transport phase)"
  - "Object drops below z=-0.05m triggers episode termination"
  - "Ground plane at z=-1.05 (IsaacLab convention)"
