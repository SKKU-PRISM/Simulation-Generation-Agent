# Task Document: FrankaShapeSort
# Version: 1.0.0
# Template: v2.0.0
# Description: Franka robot sorts primitive objects by shape (cubes vs spheres) into matching bins

task:
  name: FrankaShapeSort
  description: "Franka Panda robot sorts objects by shape: place cubes on the purple bin, spheres on the rose bin"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]             # m/s^2
  timestep: 0.01                     # 100 Hz simulation
  decimation: 5                      # control at 20 Hz
  episode_length: 30.0               # seconds
  render_interval: 2
  physx:
    bounce_threshold: 0.01           # m/s
    friction_correlation_distance: 0.00625  # m
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]          # IsaacLab convention

assets:
  # Franka Panda robot
  - name: robot
    type: articulation
    source: usd
    robot_type: franka
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]           # wxyz quaternion
    initial_joints:
      panda_joint1: 0.0
      panda_joint2: -0.7854
      panda_joint3: 0.0
      panda_joint4: -2.3562
      panda_joint5: 0.0
      panda_joint6: 1.5708
      panda_joint7: 0.7854
      panda_finger_joint: 0.04
    actuators:
      shoulder:
        joint_names: ["panda_joint1", "panda_joint2", "panda_joint3", "panda_joint4"]
        effort_limit: 87.0
        stiffness: 80.0
        damping: 4.0
      forearm:
        joint_names: ["panda_joint5", "panda_joint6", "panda_joint7"]
        effort_limit: 12.0
        stiffness: 80.0
        damping: 4.0
      hand:
        joint_names: ["panda_finger_joint.*"]
        effort_limit: 200.0
        stiffness: 2000.0
        damping: 100.0
    ee_frame:
      body: panda_hand
      offset_position: [0, 0, 0.1034]
    physics:
      self_collision: true
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0
    randomize:
      joint_position:
        distribution: gaussian
        mean: 0.0
        std: 0.02

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # Small cube 1 (light blue)
  - name: small_cube_1
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/SmallCube1"
    position: [0.42, -0.05, 0.0175]  # half_h = 0.035/2
    scale: [0.035, 0.035, 0.035]     # 3.5cm cube
    color: [0.2, 0.6, 0.9]           # light blue
    physics:
      rigid_body: true
      collision: true
      mass: 0.05
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.38, 0.52]
        y: [-0.10, 0.10]
        z: 0.0175
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.08

  # Small cube 2 (orange)
  - name: small_cube_2
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/SmallCube2"
    position: [0.48, 0.06, 0.0175]
    scale: [0.035, 0.035, 0.035]
    color: [0.9, 0.5, 0.2]           # orange
    physics:
      rigid_body: true
      collision: true
      mass: 0.05
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.38, 0.52]
        y: [-0.10, 0.10]
        z: 0.0175
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.08

  # Sphere 1 (pink)
  - name: sphere_1
    type: rigid
    source: primitive
    primitive: sphere
    prim_path: "/World/Sphere1"
    position: [0.45, 0.02, 0.02]     # radius = 0.04/2 = 0.02
    scale: [0.04, 0.04, 0.04]        # 4cm diameter sphere
    color: [0.9, 0.2, 0.5]           # pink
    physics:
      rigid_body: true
      collision: true
      mass: 0.04
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.38, 0.52]
        y: [-0.10, 0.10]
        z: 0.02
      min_separation: 0.08

  # Sphere 2 (lime green)
  - name: sphere_2
    type: rigid
    source: primitive
    primitive: sphere
    prim_path: "/World/Sphere2"
    position: [0.50, -0.08, 0.02]
    scale: [0.04, 0.04, 0.04]
    color: [0.5, 0.9, 0.3]           # lime green
    physics:
      rigid_body: true
      collision: true
      mass: 0.04
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.38, 0.52]
        y: [-0.10, 0.10]
        z: 0.02
      min_separation: 0.08

  # Cube bin (purple target zone)
  - name: cube_bin
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/CubeBin"
    position: [0.60, -0.10, 0.002]
    scale: [0.08, 0.08, 0.003]       # 8cm x 8cm flat pad
    color: [0.4, 0.4, 0.7]           # purple
    physics:
      rigid_body: false
      collision: false

  # Sphere bin (rose target zone)
  - name: sphere_bin
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/SphereBin"
    position: [0.60, 0.10, 0.002]
    scale: [0.08, 0.08, 0.003]
    color: [0.7, 0.4, 0.4]           # rose
    physics:
      rigid_body: false
      collision: false

goal:
  description: "Sort objects by shape: place cubes on the purple bin, spheres on the rose bin"
  conditions:
    - subject: small_cube_1
      relation: at_position
      target: cube_bin
      tolerance: 0.04
    - subject: small_cube_2
      relation: at_position
      target: cube_bin
      tolerance: 0.04
    - subject: sphere_1
      relation: at_position
      target: sphere_bin
      tolerance: 0.04
    - subject: sphere_2
      relation: at_position
      target: sphere_bin
      tolerance: 0.04

camera:
  prim_path: "/World/Camera"
  position: [1.5, 1.2, 1.0]
  target: [0.45, 0, 0.25]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Only task using primitive shapes as manipulation objects (not USD blocks)"
  - "Cube z=0.0175m (half of 3.5cm scale), sphere z=0.02m (radius of 4cm diameter)"
  - "Sphere grasping is harder than cubes due to rolling and curved surface"
  - "4 objects sorted into 2 bins based on geometric shape"
  - "Target bins are flat visual markers (no physics, no collision)"
  - "All objects randomized with min 0.08m separation"
  - "Ground plane at z=-1.05 (IsaacLab convention)"
  - "Control rate: 20Hz (decimation=5), episode: 30s"
