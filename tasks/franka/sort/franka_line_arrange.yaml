# Task Document: FrankaLineArrange
# Version: 1.0.0
# Template: v2.0.0
# Description: Franka robot arranges 3 colored blocks in a specific left-to-right order

task:
  name: FrankaLineArrange
  description: "Franka Panda robot arranges colored blocks in a line at x=0.55: blue (y=-0.06), red (y=0.0), green (y=0.06)"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]             # m/s^2
  timestep: 0.01                     # 100 Hz simulation
  decimation: 5                      # control at 20 Hz
  episode_length: 30.0               # seconds
  render_interval: 2
  physx:
    bounce_threshold: 0.01           # m/s
    friction_correlation_distance: 0.00625  # m
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]          # IsaacLab convention

assets:
  # Franka Panda robot
  - name: robot
    type: articulation
    source: usd
    robot_type: franka
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]           # wxyz quaternion
    initial_joints:
      panda_joint1: 0.0
      panda_joint2: -0.7854
      panda_joint3: 0.0
      panda_joint4: -2.3562
      panda_joint5: 0.0
      panda_joint6: 1.5708
      panda_joint7: 0.7854
      panda_finger_joint: 0.04
    actuators:
      shoulder:
        joint_names: ["panda_joint1", "panda_joint2", "panda_joint3", "panda_joint4"]
        effort_limit: 87.0
        stiffness: 80.0
        damping: 4.0
      forearm:
        joint_names: ["panda_joint5", "panda_joint6", "panda_joint7"]
        effort_limit: 12.0
        stiffness: 80.0
        damping: 4.0
      hand:
        joint_names: ["panda_finger_joint.*"]
        effort_limit: 200.0
        stiffness: 2000.0
        damping: 100.0
    ee_frame:
      body: panda_hand
      offset_position: [0, 0, 0.1034]
    physics:
      self_collision: true
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0
    randomize:
      joint_position:
        distribution: gaussian
        mean: 0.0
        std: 0.02

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # Blue block (target: left position)
  - name: blue_block
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/blue_block.usd"
    prim_path: "/World/BlueBlock"
    position: [0.45, 0.08, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "blue_block"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.38, 0.55]
        y: [-0.12, 0.12]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # Red block (target: center position)
  - name: red_block
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/red_block.usd"
    prim_path: "/World/RedBlock"
    position: [0.50, -0.05, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "red_block"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.38, 0.55]
        y: [-0.12, 0.12]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # Green block (target: right position)
  - name: green_block
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/green_block.usd"
    prim_path: "/World/GreenBlock"
    position: [0.55, 0.03, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "green_block"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.38, 0.55]
        y: [-0.12, 0.12]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # Position marker 1 - blue target (left)
  - name: pos_marker_1
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PosMarker1"
    position: [0.55, -0.06, 0.002]
    scale: [0.04, 0.04, 0.002]       # 4cm x 4cm flat marker
    color: [0.0, 0.0, 0.6]           # dim blue
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.50, 0.60]
        y: [-0.11, -0.01]
        z: 0.002

  # Position marker 2 - red target (center)
  - name: pos_marker_2
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PosMarker2"
    position: [0.55, 0.0, 0.002]
    scale: [0.04, 0.04, 0.002]
    color: [0.6, 0.0, 0.0]           # dim red
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.50, 0.60]
        y: [-0.05, 0.05]
        z: 0.002

  # Position marker 3 - green target (right)
  - name: pos_marker_3
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/PosMarker3"
    position: [0.55, 0.06, 0.002]
    scale: [0.04, 0.04, 0.002]
    color: [0.0, 0.6, 0.0]           # dim green
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.50, 0.60]
        y: [0.01, 0.11]
        z: 0.002

goal:
  description: "Arrange blocks in a line at x=0.55: blue (y=-0.06), red (y=0.0), green (y=0.06)"
  conditions:
    - subject: blue_block
      relation: at_position
      target: pos_marker_1
      tolerance: 0.025                # tighter tolerance for precision
    - subject: red_block
      relation: at_position
      target: pos_marker_2
      tolerance: 0.025
    - subject: green_block
      relation: at_position
      target: pos_marker_3
      tolerance: 0.025

camera:
  prim_path: "/World/Camera"
  position: [0.5, 0.0, 1.05]         # normalized top-down tabletop view
  target: [0.5, 0.0, 0.05]
  fov: 60
  resolution: [1280, 720]

notes:
  - "Blocks must be arranged in a specific left-to-right order: blue, red, green"
  - "Target line is at x=0.55 with 6cm spacing between positions"
  - "Tighter tolerance (2.5cm) than other tasks to test precision placement"
  - "Position markers are dim-colored flat pads matching their target block color"
  - "Block positions randomized with absolute range, min 0.10m separation"
  - "Ground plane at z=-1.05 (IsaacLab convention)"
  - "Control rate: 20Hz (decimation=5), episode: 30s"
