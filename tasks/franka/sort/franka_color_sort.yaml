# Task Document: FrankaColorSort
# Version: 1.0.0
# Template: v2.0.0
# Description: Franka robot sorts 3 colored blocks onto matching colored target zones

task:
  name: FrankaColorSort
  description: "Franka Panda robot sorts colored blocks onto matching colored target zones: blue block -> blue zone, red block -> red zone, green block -> green zone"
  version: "1.0.0"

simulation:
  gravity: [0, 0, -9.81]             # m/s^2
  timestep: 0.01                     # 100 Hz simulation
  decimation: 5                      # control at 20 Hz (every 5 sim steps)
  episode_length: 30.0               # seconds
  render_interval: 2
  physx:
    bounce_threshold: 0.01           # m/s
    friction_correlation_distance: 0.00625  # m
    gpu_found_lost_aggregate_pairs_capacity: 4194304
    gpu_total_aggregate_pairs_capacity: 16384

scene:
  lighting:
    type: dome
    intensity: 3000
    color: [0.75, 0.75, 0.75]

  ground:
    enabled: true
    asset_path: "{ISAAC_NUCLEUS_DIR}/Environments/Grid/default_environment.usd"
    position: [0, 0, -1.05]          # IsaacLab convention

assets:
  # Franka Panda robot
  - name: robot
    type: articulation
    source: usd
    robot_type: franka
    asset_path: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
    prim_path: "/World/Robot"
    position: [0, 0, 0]
    rotation: [1, 0, 0, 0]           # wxyz quaternion
    initial_joints:
      panda_joint1: 0.0
      panda_joint2: -0.7854              # -pi/4
      panda_joint3: 0.0
      panda_joint4: -2.3562              # -3pi/4
      panda_joint5: 0.0
      panda_joint6: 1.5708               # pi/2
      panda_joint7: 0.7854               # pi/4
      panda_finger_joint: 0.04           # gripper open
    actuators:
      shoulder:
        joint_names: ["panda_joint1", "panda_joint2", "panda_joint3", "panda_joint4"]
        effort_limit: 87.0
        stiffness: 80.0
        damping: 4.0
      forearm:
        joint_names: ["panda_joint5", "panda_joint6", "panda_joint7"]
        effort_limit: 12.0
        stiffness: 80.0
        damping: 4.0
      hand:
        joint_names: ["panda_finger_joint.*"]
        effort_limit: 200.0
        stiffness: 2000.0
        damping: 100.0
    ee_frame:
      body: panda_hand
      offset_position: [0, 0, 0.1034]
    physics:
      self_collision: true
      solver_position_iterations: 8
      solver_velocity_iterations: 0
      max_depenetration_velocity: 5.0
    randomize:
      joint_position:
        distribution: gaussian
        mean: 0.0
        std: 0.02

  # SeattleLabTable
  - name: table
    type: static
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    prim_path: "/World/Table"
    position: [0.5, 0.0, 0.0]
    rotation: [0.707, 0, 0, 0.707]   # wxyz: 90-degree Z rotation
    scale: [1.0, 1.0, 1.0]
    physics:
      collision: true

  # Blue block
  - name: blue_block
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/blue_block.usd"
    prim_path: "/World/BlueBlock"
    position: [0.45, 0.0, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "blue_block"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.38, 0.55]
        y: [-0.10, 0.10]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # Red block
  - name: red_block
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/red_block.usd"
    prim_path: "/World/RedBlock"
    position: [0.50, -0.05, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "red_block"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.38, 0.55]
        y: [-0.10, 0.10]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # Green block
  - name: green_block
    type: rigid
    source: usd
    asset_path: "{ISAAC_NUCLEUS_DIR}/Props/Blocks/green_block.usd"
    prim_path: "/World/GreenBlock"
    position: [0.55, 0.05, 0.0203]
    rotation: [1, 0, 0, 0]
    scale: [1.0, 1.0, 1.0]
    semantic_tag: ["class", "green_block"]
    physics:
      rigid_body: true
      collision: true
      solver_position_iterations: 16
      solver_velocity_iterations: 1
      max_angular_velocity: 1000.0
      max_linear_velocity: 1000.0
      max_depenetration_velocity: 5.0
    randomize:
      position:
        type: absolute
        x: [0.38, 0.55]
        y: [-0.10, 0.10]
        z: 0.0203
      orientation:
        yaw: [-1.0, 1.0]
      min_separation: 0.10

  # Blue target zone (flat marker)
  - name: blue_zone
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/BlueZone"
    position: [0.60, -0.15, 0.002]
    scale: [0.06, 0.06, 0.003]       # 6cm x 6cm flat pad
    color: [0.0, 0.0, 0.8]
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.55, 0.65]
        y: [-0.20, -0.10]
        z: 0.002

  # Red target zone (flat marker)
  - name: red_zone
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/RedZone"
    position: [0.60, 0.0, 0.002]
    scale: [0.06, 0.06, 0.003]
    color: [0.8, 0.0, 0.0]
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.55, 0.65]
        y: [-0.05, 0.05]
        z: 0.002

  # Green target zone (flat marker)
  - name: green_zone
    type: rigid
    source: primitive
    primitive: cube
    prim_path: "/World/GreenZone"
    position: [0.60, 0.15, 0.002]
    scale: [0.06, 0.06, 0.003]
    color: [0.0, 0.8, 0.0]
    physics:
      rigid_body: false
      collision: false
    randomize:
      position:
        type: absolute
        x: [0.55, 0.65]
        y: [0.10, 0.20]
        z: 0.002

goal:
  description: "Sort each colored block onto its matching colored zone: blue block -> blue zone, red block -> red zone, green block -> green zone"
  conditions:
    - subject: blue_block
      relation: at_position
      target: blue_zone
      tolerance: 0.03
    - subject: red_block
      relation: at_position
      target: red_zone
      tolerance: 0.03
    - subject: green_block
      relation: at_position
      target: green_zone
      tolerance: 0.03

camera:
  prim_path: "/World/Camera"
  position: [0.5, 0.0, 1.05]         # normalized top-down tabletop view
  target: [0.5, 0.0, 0.05]
  fov: 60
  resolution: [1280, 720]

notes:
  - "3 colored blocks must be sorted onto matching colored target zones"
  - "Block z=0.0203m is table surface + half block height"
  - "Target zones are flat visual markers (no physics, no collision)"
  - "Block positions randomized with absolute range, min 0.10m separation"
  - "Ground plane at z=-1.05 (IsaacLab convention)"
  - "Control rate: 20Hz (decimation=5), episode: 30s"
