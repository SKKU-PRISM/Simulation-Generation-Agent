[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-generation-agent"
version = "0.1.0"
description = "YAML-based robotics simulation auto-configuration framework (YAML 기반 로보틱스 시뮬레이션 환경 자동 구성 프레임워크)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "aiofiles>=23.0",
    "asyncio-throttle>=1.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "google-generativeai>=0.8.0",
    "openai>=1.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "faiss-cpu>=1.7.0,<1.10.0",  # 1.10+ requires numpy 2.x
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
data-collection = [
    "pin>=2.6.0",           # Pinocchio IK (ADC KinematicsEngine)
    "scipy>=1.11.0",        # Trajectory interpolation (ADC)
    "opencv-python>=4.8.0", # VLM judge image encoding
    "lerobot>=0.4.0,<0.5.0",  # LeRobot dataset format (0.5+ requires Python 3.12)
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
