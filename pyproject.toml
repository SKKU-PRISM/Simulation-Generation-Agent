[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-generation-agent"
version = "0.1.0"
description = "YAML 기반 로보틱스 시뮬레이션 환경 자동 구성 프레임워크"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "aiofiles>=23.0",
    "asyncio-throttle>=1.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "google-generativeai>=0.8.0",
    "openai>=1.0",
]

[tool.setuptools.packages.find]
include = ["src*"]
